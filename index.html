</head>

const DECK_SIZE = 12, MAX_COPIES = 3;

const RARITY_KEYS = ['gewoehnlich', 'selten', 'episch', 'legendaer'];

];
const compat = (card, cls) => !card.types || card.types.includes(WEAPONS[cls.weapon].type);
const copyLimit = card => Math.min(MAX_COPIES, card.max);
const cardOrder = id => CARDS.findIndex(c => c.id === id);

function defaultDeck(cls, owned) {
  // zuerst Karten, die nur zu dieser Waffe passen, dann allgemeine
  const list = CARDS.filter(c => compat(c, cls)).sort((a, b) => (b.types ? 1 : 0) - (a.types ? 1 : 0));
  const deck = [];
  for (const c of list) {
    for (let i = 0; i < Math.min(2, copyLimit(c), owned[c.id] || 0) && deck.length < DECK_SIZE; i++) deck.push(c.id);
  }
  return deck.sort((a, b) => cardOrder(a) - cardOrder(b));
}
function loadSave() {
  let sv = null;
  try { sv = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (!sv || typeof sv !== 'object') sv = {};
  sv.owned = sv.owned || {};
  for (const c of CARDS) if (sv.owned[c.id] === undefined) sv.owned[c.id] = STARTER_COUNT[c.rarity];
  if (typeof sv.silver !== 'number') sv.silver = START_SILVER;
  sv.maxStage = sv.maxStage || 1;
  if (CHEAT) {
    for (const c of CARDS) sv.owned[c.id] = Math.max(sv.owned[c.id], CHEAT_COUNT[c.rarity]);
    sv.silver = Math.max(sv.silver, 5000); sv.maxStage = Math.max(sv.maxStage, 5);
  }
  sv.decks = sv.decks || {};
  for (const cls of CLASSES) {
    let d = sv.decks[cls.id];
    if (!Array.isArray(d)) d = defaultDeck(cls, sv.owned);
    sv.decks[cls.id] = d.filter(id => CARD_BY_ID[id] && compat(CARD_BY_ID[id], cls)).slice(0, DECK_SIZE);
  }
  return sv;
}
let SAVE = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
const deckOf = cls => SAVE.decks[cls.id];
const inDeck = (cls, id) => deckOf(cls).filter(x => x === id).length;
function canAddCard(cls, card) {
  return compat(card, cls) && deckOf(cls).length < DECK_SIZE && inDeck(cls, card.id) < Math.min(copyLimit(card), SAVE.owned[card.id] || 0);
}
function addToDeck(cls, card) {
  if (!canAddCard(cls, card)) return false;
  const d = deckOf(cls); d.push(card.id); d.sort((a, b) => cardOrder(a) - cardOrder(b));
  persist(); return true;
}
function removeFromDeck(cls, id) {
  const d = deckOf(cls), i = d.lastIndexOf(id);
  if (i >= 0) { d.splice(i, 1); persist(); }
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  let tmin = 0, tmax = 1;
  const dx = x2 - x1, dy = y2 - y1;
  if (Math.abs(dx) < 1e-9) { if (x1 < r.x || x1 > r.x + r.w) return Infinity; }
  else {
    let t1 = (r.x - x1) / dx, t2 = (r.x + r.w - x1) / dx;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }

    if (tmin > tmax) return Infinity;
  }
  if (Math.abs(dy) < 1e-9) { if (y1 < r.y || y1 > r.y + r.h) return Infinity; }
  else {
    let t1 = (r.y - y1) / dy, t2 = (r.y + r.h - y1) / dy;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }

    if (tmin > tmax) return Infinity;

    const sx = s[2] - s[0], sy = s[3] - s[1];
    const den = dx * sy - dy * sx;
    if (Math.abs(den) < 1e-9) continue;
    const t = ((s[0] - ox) * sy - (s[1] - oy) * sx) / den;

}

function generate() {

    const count = k === 0 ? 4 : Math.floor(rand(6, 10));
    for (let i = 0; i < count; i++) {
      for (let t = 0; t < 30; t++) {
        const r = Math.random();
        const kind = r < 0.4 ? 'wall' : r < 0.7 ? 'rock' : 'tree';
        let w = rand(60, 170), h = rand(40, 120);
        if (kind === 'tree') { w = rand(64, 104); h = w; }
        const o = { kind, seed: Math.random(), x: rand(70, WORLD_W - 70 - w), y: rand(y0 + 30, y1 - h - 30), w, h };
        if (kind === 'tree') { o.r = w / 2; o.cx = o.x + o.r; o.cy = o.y + o.r; }   // Bäume haben runde Hitboxen
        if (k === 0 && o.y + o.h > -230 && o.x < 700 && o.x + o.w > 260) continue;
        if (G.obstacles.some(p => rectsGap(o, p, 80))) continue;
        G.obstacles.push(o);
        break;
      }
    }
    // Gegner fest in der Welt
    if (k > 0) {
      const n = Math.min(2 + Math.floor(k * 0.6), 9);
      for (let i = 0; i < n; i++) {
        const spot = freeSpot(14, 40, y0 + 40, y1 - 40);
        if (!spot) continue;
        const rushP = Math.min(0.25 + k * 0.02, 0.45);
        const group = Math.random() < 0.35 ? 2 + Math.floor(Math.random() * 2) : 1;
        for (let g = 0; g < group; g++) {
          const type = Math.random() < rushP ? 'rusher' : 'grunt';

          if (G.obstacles.some(o => gx > o.x - 20 && gx < o.x + o.w + 20 && gy > o.y - 20 && gy < o.y + o.h + 20)) continue;

    if (k > 0 && Math.random() < 0.5) {

      if (s) G.pickups.push({ x: s.x, y: s.y, heal: 30 });

    if (k >= 2 && G.chunkSinceMerchant >= MERCHANT_MIN_GAP && Math.random() < MERCHANT_CHANCE) {

}

const MERCHANT_ODDS_EARLY = [72, 22, 5, 1], MERCHANT_ODDS_LATE = [15, 30, 35, 20], MERCHANT_SCALE_M = 700;
function merchantOdds() {
  const t = clamp(G.dist / MERCHANT_SCALE_M, 0, 1);
  return MERCHANT_ODDS_EARLY.map((v, i) => v + (MERCHANT_ODDS_LATE[i] - v) * t);

function rollRarityKey(odds) {
  let r = Math.random() * odds.reduce((a, b) => a + b, 0), i = 0;
  for (; i < 3; i++) { r -= odds[i]; if (r < 0) break; }
  return RARITY_KEYS[i];
}
function pickByRarity(list, key, used) {
  for (let i = RARITY_KEYS.indexOf(key); i >= 0; i--) {
    const l = list.filter(x => x.rarity === RARITY_KEYS[i] && !used.includes(x));
    if (l.length) return l[Math.floor(Math.random() * l.length)];
  }
  const rest = list.filter(x => !used.includes(x));
  return rest[Math.floor(Math.random() * rest.length)];
}
function makeMerchantOffers() {

  const buffPool = BUFFS.filter(b => !b.types || b.types.includes(t));
  const mk = (pool, kind) => {
    const used = [], out = [];
    for (let i = 0; i < 3; i++) {
      const it = pickByRarity(pool, rollRarityKey(odds), used);
      if (!it) break;
      used.push(it);
      out.push({ kind, item: it, price: Math.round(MERCHANT_PRICE[it.rarity] * (kind === 'buff' ? 0.6 : 1)), sold: false });

function resolve(e) {
  for (const o of G.obstacles) {
    if (o.y > e.y + 80 || o.y + o.h < e.y - 80) continue;
    if (o.kind === 'tree') {
      const tx = e.x - o.cx, ty = e.y - o.cy, td = Math.hypot(tx, ty), tm = o.r + e.r;
      if (td < tm) {
        if (td > 1e-6) { e.x += tx / td * (tm - td); e.y += ty / td * (tm - td); } else e.x += tm;
      }
      continue;
    }
    const cx = clamp(e.x, o.x, o.x + o.w), cy = clamp(e.y, o.y, o.y + o.h);
    const dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;
    if (d2 >= e.r * e.r) continue;
    if (d2 > 1e-6) {
      const d = Math.sqrt(d2);
      e.x += dx / d * (e.r - d); e.y += dy / d * (e.r - d);
    } else {
      const l = e.x - o.x, r = o.x + o.w - e.x, t = e.y - o.y, b = o.y + o.h - e.y, m = Math.min(l, r, t, b);
      if (m === l) e.x = o.x - e.r; else if (m === r) e.x = o.x + o.w + e.r;
      else if (m === t) e.y = o.y - e.r; else e.y = o.y + o.h + e.r;
    }
  }
  e.x = clamp(e.x, e.r, WORLD_W - e.r);
}
function moveCircle(e, dx, dy) {
  const ox = e.x, oy = e.y;
  e.x += dx; resolve(e);
  e.y += dy; resolve(e);
  return Math.hypot(e.x - ox, e.y - oy);
}
// Trefferzeit (0..1) einer Strecke mit einer Deckung; Bäume sind Kreise
function hitObstacle(o, x1, y1, x2, y2) {
  return o.kind === 'tree' ? segCircle(x1, y1, x2, y2, o.cx, o.cy, o.r) : segRect(x1, y1, x2, y2, o);
}
function hasLOS(x1, y1, x2, y2) {
  for (const o of G.obstacles) {
    if (Math.min(y1, y2) > o.y + o.h || Math.max(y1, y2) < o.y) continue;
    if (hitObstacle(o, x1, y1, x2, y2) !== Infinity) return false;
  }
  return true;
}

}

// ---------- Update ----------
function update(dt) {
  if (state !== 'play') return;
  const p = G.player, w = W();
  G.time += dt;

  // Bewegung (WASD) oder Windstoß
  let mx = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
  let my = (held('down') ? 1 : 0) - (held('up') ? 1 : 0);
  let moved;
  if (p.dashT > 0) {
    p.dashT -= dt;
    const v = DASH.dist / DASH.time;
    moved = moveCircle(p, p.dashX * v * dt, p.dashY * v * dt);
  } else {
    const len = Math.hypot(mx, my) || 1;
    let sp = S.moveSpeed * (p.reloadT > 0 ? 0.9 : 1);
    if (isBlocking()) sp *= 0.55; else if (isFocusing()) sp *= 0.65; else if (isMeditating()) sp *= 0.5;
    moved = moveCircle(p, mx / len * sp * dt, my / len * sp * dt);
  }
  p.speed = Math.min(moved / dt, S.moveSpeed * 1.3);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.invuln = Math.max(0, (p.invuln || 0) - dt);
  p.swingT = Math.max(0, p.swingT - dt);
  p.y = clamp(p.y, G.camTop + p.r, G.camTop + VIEW_H - p.r);   // nicht aus dem Bild zurück

  p.angle = Math.atan2(mouse.y + G.camTop - p.y, mouse.x - p.x);

  // Waffe
  p.cooldown = Math.max(0, p.cooldown - dt);
  p.bloom = Math.max(0, p.bloom - (w.bloomRecover || 0) * dt);
  if (w.type === 'spell') {
    p.manaDelay = Math.max(0, p.manaDelay - dt);
    if (p.manaDelay <= 0) p.mana = Math.min(S.manaMax, p.mana + w.regen * S.manaRegenMul * (isMeditating() ? 3 : 1) * dt);
    else p.mana = Math.min(S.manaMax, p.mana);
  }
  if (p.reloadT > 0) {
    p.reloadT -= dt;
    if (p.reloadT <= 0) { p.reloadT = 0; p.mag = S.magSize; sfx('reload_done'); }
  } else if ((settings.autofire ? mouse.down : mouse.pressed) && p.cooldown <= 0 && !isBlocking() && !isMeditating()) {
    if (w.type === 'ranged' && p.mag <= 0) sfx('empty_click');
    else if (w.type === 'spell' && p.mana < w.cost) sfx('empty_click');
    else playerAttack();
    mouse.pressed = false;
  }

  // Kamera: nur nach oben, ab oberem Drittel
  if (!G.camLock && p.y < G.camTop + VIEW_H / 3) G.camTop = p.y - VIEW_H / 3;
  G.dist = Math.max(G.dist, -p.y / PX_PER_M);
  generate();

  updateEnemies(dt);
  if (G.dist >= BOSS_DIST && !G.bossSpawned) spawnBoss();
  if (!G.bossSpawned) spawnReinforcements();
  updateBullets(dt);

  for (const k of G.pickups) {
    if (!k.taken && Math.hypot(k.x - p.x, k.y - p.y) < p.r + 12) {
      k.taken = true; p.hp = Math.min(S.maxHp, p.hp + k.heal);
      say('+' + k.heal + ' Leben'); sfx('pickup_heal');
    }
  }

  for (const q of G.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  for (const a of G.arcs) a.life -= dt;
  for (const r of G.rings) r.life -= dt;
  G.hurtT = Math.max(0, G.hurtT - dt);
  G.shakeT = Math.max(0, G.shakeT - dt);
  for (const f of G.floats) { f.y -= 38 * dt; f.t -= dt; }
  G.floats = G.floats.filter(f => f.t > 0);
  G.msgT = Math.max(0, G.msgT - dt);

  const bottom = G.camTop + VIEW_H + 250;
  G.obstacles = G.obstacles.filter(o => o.y < bottom);
  G.enemies = G.enemies.filter(e => e.hp > 0 && e.y < bottom);
  G.merchants = G.merchants.filter(m => m.y < bottom);
  G.pickups = G.pickups.filter(k => !k.taken && k.y < bottom);
  G.parts = G.parts.filter(q => q.life > 0);
  G.arcs = G.arcs.filter(a => a.life > 0);
  G.rings = G.rings.filter(r => r.life > 0);

  if (G.boss && G.boss.hp <= 0 && !G.won) { winRun(); return; }
  if (p.hp <= 0) { die(); return; }
  if (G.dist >= G.nextPick && !G.bossSpawned) openPick();
}

function spawnBoss() {
  G.bossSpawned = true; G.camLock = true;
  const b = makeEnemy('boss', WORLD_W / 2, G.camTop + 70, true);
  b.in = true; b.reaction = 1.2;
  G.enemies.push(b); G.boss = b;
  say('Der Bogenmeister stellt sich dir in den Weg!'); sfx('horde_horn');
}
function winRun() {
  G.won = true;
  sfx('stage_up');
  finishRun();
  state = 'dead';
}
function say(t) { G.msg = t; G.msgT = 2.2; }

// ---------- Kartenwahl ----------
// Die Auswahl kommt aus dem Kartenbuch des Streiters: mehr Kopien = höhere Chance
function rollOffers() {
  const n = 3 + S.extraChoices;
  const ids = [...new Set(G.library)];
  const out = [];
  while (out.length < n && ids.length) {
    const weights = ids.map(id => G.library.filter(x => x === id).length);
    let r = Math.random() * weights.reduce((a, b) => a + b, 0), idx = 0;
    for (; idx < ids.length; idx++) { r -= weights[idx]; if (r <= 0) break; }
    out.push(CARD_BY_ID[ids.splice(Math.min(idx, ids.length - 1), 1)[0]]);
  }
  return out;
}
function openPick() {
  G.offers = rollOffers();
  if (!G.offers.length) { advanceStage(); return; }
  pickHover = -1;
  mouse.down = false; mouse.rdown = false;
  sfx('stage_up');
  state = 'pick';
}
function advanceStage() {
  G.stageStart = G.nextPick;
  G.stage++;
  G.nextPick += stageLength(G.stage);
}
function choosePick(i) {
  const card = G.offers[i];
  if (!card) return;
  const p = G.player, oldMag = S.magSize, oldHp = S.maxHp;
  G.cards.push(card.id);
  const li = G.library.indexOf(card.id); if (li >= 0) G.library.splice(li, 1);
  recomputeStats();
  if (S.magSize > oldMag) p.mag += S.magSize - oldMag;
  if (S.maxHp > oldHp) p.hp += S.maxHp - oldHp;
  advanceStage();
  say(card.name + ': ' + card.stat);
  sfx('card_pick');
  mouse.down = false; mouse.rdown = false;
  state = 'play';
}
function pickLayout() {
  const n = G.offers.length;
  const k = n >= 4 ? 1.0 : 1.18;
  const w = 220 * k, h = 320 * k, gap = n >= 4 ? 34 : 54;
  const total = n * w + (n - 1) * gap;
  const x0 = (FRAME_W - total) / 2, y = 168;
  return G.offers.map((c, i) => ({ c, x: x0 + i * (w + gap), y, w, h, k }));
}

// ---------- Charakterwahl ----------
const SEL = { w: 300, h: 470, gap: 40, y: 150 };
function selectLayout() {
  const total = CLASSES.length * SEL.w + (CLASSES.length - 1) * SEL.gap;
  const x0 = (FRAME_W - total) / 2;
  return CLASSES.map((c, i) => ({ c, i, x: x0 + i * (SEL.w + SEL.gap), y: SEL.y, w: SEL.w, h: SEL.h }));
}
function startRun(i) {
  lastClass = i;
  try { localStorage.setItem('left-behind-class', CLASSES[i].id); } catch (e) {}
  newGame(CLASSES[i]);
  mouse.down = false; mouse.rdown = false;
  state = 'play';
}

function updateEnemies(dt) {
  const p = G.player;
  for (const e of G.enemies) {
    const T = ENEMY_TYPES[e.type];
    e.hit = Math.max(0, e.hit - dt);
    if (!e.in && e.y >= G.camTop + e.r) e.in = true;   // ab jetzt dürfen sie das Bild nicht mehr verlassen
    const dx = p.x - e.x, dy = p.y - e.y, dist = Math.hypot(dx, dy);
    const los = hasLOS(e.x, e.y, p.x, p.y);

    if (e.state === 'idle') {
      if (los && dist < 440 && e.in) { e.reaction -= dt; if (e.reaction <= 0) alertEnemy(e); }
      else e.reaction = Math.min(0.7, e.reaction + dt);
      continue;
    }

    if (los && dist < 640) { e.lastX = p.x; e.lastY = p.y; e.lostT = 0; }
    else { e.lostT += dt; }
    e.angle = Math.atan2(dy, dx);

    let dirx = 0, diry = 0, speed = T.speed;
    const tx = e.lastX - e.x, ty = e.lastY - e.y, td = Math.hypot(tx, ty) || 1;

    if (e.type === 'grunt' || e.type === 'boss') {
      if (los && dist < 640) {
        e.reaction -= dt;
        e.strafeT -= dt;
        if (e.strafeT <= 0) { e.strafe *= -1; e.strafeT = rand(1.2, 2.8); }
        if (dist > 380) { dirx = dx / dist; diry = dy / dist; speed = T.chase; }
        else if (dist < 230) { dirx = -dx / dist; diry = -dy / dist; }
        else { dirx = -dy / dist * e.strafe; diry = dx / dist * e.strafe; speed = T.speed * 0.8; }
        e.cooldown -= dt;
        if (e.reaction <= 0 && e.cooldown <= 0 && e.in) {
          const a = e.angle + (Math.random() + Math.random() - 1) * 6 * deg;
          if (T.boss) addBullet(e.x, e.y, a, 400, 16, 'enemy', 900, 0, { rad: 7, big: true });
          else addBullet(e.x, e.y, a, 430, 8, 'enemy', 760, 0);
          sfx('enemy_shoot', clamp(1 - dist / 800, 0.15, 1));
          e.burst++;
          if (e.burst >= 3) { e.burst = 0; e.cooldown = rand(1.3, 2.2); } else e.cooldown = 0.17;
        }
      } else if (td > 24) { dirx = tx / td; diry = ty / td; speed = T.chase; }
    } else {
      if (td > 6) { dirx = tx / td; diry = ty / td; speed = T.chase; }
      e.melee = Math.max(0, e.melee - dt);
      if (dist < e.r + p.r + 4 && e.melee <= 0) { hurtPlayer(12, Math.atan2(e.y - p.y, e.x - p.x)); e.melee = 0.7; }
    }

    if (e.steerT > 0) {
      e.steerT -= dt;
      const sx = dirx, sy = diry;
      dirx = -sy * e.steerDir; diry = sx * e.steerDir;
    }
    if (dirx || diry) {
      const moved = moveCircle(e, dirx * speed * dt, diry * speed * dt);
      if (moved < speed * dt * 0.3) {
        e.stuckT += dt;
        if (e.stuckT > 0.3) { e.steerT = 0.8; e.steerDir = Math.random() < 0.5 ? 1 : -1; e.stuckT = 0; }
      } else e.stuckT = 0;
    }
    for (const o of G.enemies) {
      if (o === e) continue;
      const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy);
      if (od > 0 && od < e.r + o.r) moveCircle(e, ox / od * 40 * dt, oy / od * 40 * dt);
    }
    if (e.in) { e.x = clamp(e.x, e.r, WORLD_W - e.r); e.y = clamp(e.y, G.camTop + e.r, G.camTop + VIEW_H - e.r); }
    if (e.lostT > 6 && e.type === 'grunt') { e.state = 'idle'; e.reaction = 0.7; }
  }
}

// Unregelmäßig: Wellen und einzelne Nachzügler von oben
function spawnEnemy(type) {
  const y = G.camTop - rand(30, 120);
  for (let t = 0; t < 20; t++) {
    const x = rand(70, WORLD_W - 70);
    if (G.obstacles.some(o => x > o.x - 30 && x < o.x + o.w + 30 && y > o.y - 30 && y < o.y + o.h + 30)) continue;
    G.enemies.push(makeEnemy(type, x, y, true));
    return true;
  }
  return false;
}
function spawnReinforcements() {
  if (G.time >= G.nextWave) {
    const n = Math.min(2 + Math.floor(G.dist / 120), 5);
    for (let i = 0; i < n; i++) spawnEnemy(Math.random() < 0.35 ? 'rusher' : 'grunt');
    say('Eine Horde bricht aus dem Wald!'); sfx('horde_horn');
    G.nextWave = G.time + rand(22, 40);
  }
  if (G.time >= G.nextSingle) {
    if (Math.random() < 0.6) spawnEnemy(Math.random() < 0.4 ? 'rusher' : 'grunt');
    G.nextSingle = G.time + rand(9, 18);
  }
}

// srcAngle: Richtung vom Spieler zur Quelle; wird mit dem Schild abgefangen
function hurtPlayer(d, srcAngle) {
  const p = G.player;
  if (p.invuln > 0) return;
  if (isBlocking() && srcAngle !== undefined && Math.abs(normAngle(srcAngle - p.angle)) < S.blockArc * deg) {
    d *= (1 - S.block);
    sfx('block');
    spark(p.x + Math.cos(p.angle) * 18, p.y + Math.sin(p.angle) * 18, '#fff3c8');
    if (d < 1) return;
  }
  p.hp -= d;
  G.hurtT = 0.35; G.shakeT = 0.25;
  sfx('player_hurt');
}

function updateBullets(dt) {
  const p = G.player;
  for (const b of G.bullets) {
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    let tObs = Infinity;
    for (const o of G.obstacles) {
      if (Math.min(b.py, b.y) > o.y + o.h || Math.max(b.py, b.y) < o.y) continue;
      tObs = Math.min(tObs, hitObstacle(o, b.px, b.py, b.x, b.y));
    }
    let tHit = Infinity, target = null;
    if (b.from === 'player') {
      for (const e of G.enemies) {
        if (e.hp <= 0 || b.ignore.includes(e)) continue;
        const t = segCircle(b.px, b.py, b.x, b.y, e.x, e.y, e.r);
        if (t < tHit) { tHit = t; target = e; }
      }
    } else {
      const t = segCircle(b.px, b.py, b.x, b.y, p.x, p.y, p.r + (b.rad || 0));
      if (t < tHit) { tHit = t; target = p; }
    }
    if (tObs === Infinity && tHit === Infinity) continue;
    if (tHit < tObs) {
      const hx = b.px + (b.x - b.px) * tHit, hy = b.py + (b.y - b.py) * tHit;
      if (target === p) { hurtPlayer(b.dmg, Math.atan2(-b.vy, -b.vx)); spark(hx, hy, '#d33'); }
      else if (b.spell) {
        explode(hx, hy, b.dmg, b.splash, target);
        if (b.pierce > 0) { b.pierce--; b.ignore.push(target); continue; }
      } else {
        damageEnemy(target, b.dmg);
        if (S.chain > 0) chainLightning(target, b.dmg * 0.5);
        spark(hx, hy, '#e8e8e8');
        if (b.pierce > 0) { b.pierce--; b.ignore.push(target); continue; }
      }
    } else {
      const hx = b.px + (b.x - b.px) * tObs, hy = b.py + (b.y - b.py) * tObs;
      if (b.spell) explode(hx, hy, b.dmg, b.splash, null); else spark(hx, hy, '#bbb');
    }
    b.life = 0;
  }
  G.bullets = G.bullets.filter(b => b.life > 0);
}
function explode(x, y, dmg, R, target) {
  sfx('spell_explode');
  G.rings.push({ x, y, r: R, life: 0.28, max: 0.28 });
  for (let i = 0; i < 10; i++) G.parts.push({ x, y, vx: rand(-140, 140), vy: rand(-140, 140), life: 0.3, color: '#c9c0ff' });
  for (const e of G.enemies) {
    if (e.hp <= 0) continue;
    if (Math.hypot(e.x - x, e.y - y) <= R + e.r) {
      damageEnemy(e, dmg * (e === target ? 1 : 0.7));
      if (e === target && S.chain > 0) chainLightning(e, dmg * 0.5);
    }
  }
}
function damageEnemy(e, dmg) {
  if (e.hp <= 0) return;
  e.hp -= dmg; e.hit = 0.12;
  if (settings.dmgnums) G.floats.push({ x: e.x + rand(-8, 8), y: e.y - e.r - 14, t: 0.8, v: Math.max(1, Math.round(dmg)) });
  sfx(e.hp > 0 ? 'hit_enemy' : 'enemy_die', clamp(1 - Math.hypot(e.x - G.player.x, e.y - G.player.y) / 900, 0.3, 1));
  if (e.state === 'idle') alertEnemy(e);
  if (e.hp <= 0) G.kills++;
}
function chainLightning(from, dmg) {
  const near = G.enemies
    .filter(o => o !== from && o.hp > 0 && Math.hypot(o.x - from.x, o.y - from.y) < 170)
    .sort((a, b) => Math.hypot(a.x - from.x, a.y - from.y) - Math.hypot(b.x - from.x, b.y - from.y))
    .slice(0, S.chain);
  for (const o of near) {
    G.arcs.push({ x1: from.x, y1: from.y, x2: o.x, y2: o.y, life: 0.18 });
    damageEnemy(o, dmg);
  }
}
function spark(x, y, color) {
  for (let i = 0; i < 4; i++) G.parts.push({ x, y, vx: rand(-90, 90), vy: rand(-90, 90), life: 0.25, color });
}

function die() {
  state = 'dead';
  sfx('player_die');
  finishRun();
}
// Lauf beenden (Tod, Aufgeben oder Hauptmenü): Mondsilber gutschreiben, nur einmal je Lauf
function finishRun() {
  if (G.finished) return;
  G.finished = true;
  G.earned = Math.max(0, Math.round(G.dist + G.kills * 3) - G.spent);   // 1 Mondsilber pro Meter, 3 pro Gefallenem, abzüglich Händler
  SAVE.silver += G.earned;
  SAVE.maxStage = Math.max(SAVE.maxStage || 1, G.stage);
  persist();
  if (G.dist > best) {
    best = G.dist;
    try { localStorage.setItem('left-behind-best', String(best)); } catch (e) {}
  }
}

// ---------- Sicht ----------
function visionParams() {
  return { fov: S.fov * deg, range: VISION.range * S.rangeMul, near: VISION.near };
}
// Ecken für Sichtstrahlen; Bäume als 16-Eck
function obstacleCorners(o) {
  if (o.kind !== 'tree') return [[o.x, o.y], [o.x + o.w, o.y], [o.x + o.w, o.y + o.h], [o.x, o.y + o.h]];
  if (!o.poly) o.poly = Array.from({ length: 16 }, (_, i) => [o.cx + Math.cos(i / 16 * Math.PI * 2) * o.r * 1.02, o.cy + Math.sin(i / 16 * Math.PI * 2) * o.r * 1.02]);
  return o.poly;
}
function obstacleSegments() {
  const segs = [], top = G.camTop - 800, bot = G.camTop + VIEW_H + 800;
  for (const o of G.obstacles) {
    if (o.y > bot || o.y + o.h < top) continue;
    const c = obstacleCorners(o);
    for (let i = 0; i < c.length; i++) { const a = c[i], b = c[(i + 1) % c.length]; segs.push([a[0], a[1], b[0], b[1]]); }
  }
  segs.push([0, top - 2000, 0, bot + 2000], [WORLD_W, top - 2000, WORLD_W, bot + 2000]);
  return segs;
}
function visPoly(cx, cy, center, half, range, segs, step) {
  const full = half >= Math.PI - 1e-6;
  const rels = [];
  const n = Math.max(8, Math.ceil(2 * half / step));
  for (let i = 0; i <= n; i++) rels.push(-half + i * (2 * half / n));
  for (const o of G.obstacles) {
    if (o.x > cx + range || o.x + o.w < cx - range || o.y > cy + range || o.y + o.h < cy - range) continue;
    for (const [px, py] of obstacleCorners(o)) {
      const rel = normAngle(Math.atan2(py - cy, px - cx) - center);
      if (Math.abs(rel) <= half) rels.push(rel - 0.0003, rel, rel + 0.0003);
    }
  }
  rels.sort((a, b) => a - b);
  const pts = [];
  if (!full) pts.push([cx, cy]);
  for (const rel of rels) {
    if (rel < -half || rel > half) continue;
    const a = center + rel, dx = Math.cos(a), dy = Math.sin(a);
    const d = rayDist(cx, cy, dx, dy, range, segs);
    pts.push([cx + dx * d, cy + dy * d]);
  }
  return pts;
}
function visible(e) {
  const p = G.player, V = visionParams();
  const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
  if (d > V.range + e.r) return false;
  const inNear = d < V.near + e.r;
  const rel = normAngle(Math.atan2(dy, dx) - p.angle);
  const inCone = Math.abs(rel) < V.fov / 2 + Math.atan2(e.r, Math.max(d, 1));
  if (!inNear && !inCone) return false;
  return hasLOS(p.x, p.y, e.x, e.y);
}
function pointVisible(x, y) { return visible({ x, y, r: 0 }); }

// ---------- Zeichnen: Helfer ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function text(str, x, y, size, color, align, font, weight) {
  ctx.font = (weight || '') + ' ' + size + 'px ' + (font || F_TEXT);
  ctx.textAlign = align || 'left';
  ctx.fillStyle = color || '#fff';
  ctx.fillText(str, x, y);
}
function wrap(str, maxW, font) {
  ctx.font = font;
  const words = str.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
function drawIcon(name, cx, cy, size, color, lw) {
  const path = ICON_PATHS[name];
  if (!path) return;
  ctx.save();
  ctx.translate(cx - size / 2, cy - size / 2);
  ctx.scale(size / 24, size / 24);
  ctx.strokeStyle = color; ctx.lineWidth = lw || 1.3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.stroke(path);
  ctx.restore();
}
function silverGrad(y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#c8d0d8'); g.addColorStop(1, '#8a94a0');
  return g;
}
function notched(x, y, w, h, n) {
  ctx.beginPath();
  ctx.moveTo(x + n, y); ctx.lineTo(x + w - n, y); ctx.lineTo(x + w, y + n); ctx.lineTo(x + w, y + h - n);
  ctx.lineTo(x + w - n, y + h); ctx.lineTo(x + n, y + h); ctx.lineTo(x, y + h - n); ctx.lineTo(x, y + n); ctx.closePath();
}

// Floor-Pattern (einmal erzeugt)
let floorPattern = null;
function makeFloor() {
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const x = c.getContext('2d');
  x.fillStyle = '#1d3524'; x.fillRect(0, 0, 160, 160);
  for (let i = 0; i < 260; i++) {
    x.fillStyle = Math.random() < 0.5 ? 'rgba(150,215,140,.10)' : 'rgba(0,0,0,.12)';
    const px = Math.random() * 160, py = Math.random() * 160;
    x.fillRect(px, py, 1.5, Math.random() * 5 + 2);
  }
  floorPattern = ctx.createPattern(c, 'repeat');
}

// ---------- Zeichnen: Welt ----------
function drawWorld() {
  const top = G.camTop;
  if (!floorPattern) makeFloor();
  ctx.fillStyle = floorPattern;
  ctx.fillRect(0, top, VIEW_W, VIEW_H);
  // Steinpfad in der Mitte
  const g = ctx.createLinearGradient(300, 0, 660, 0);
  g.addColorStop(0, 'rgba(150,150,130,0)'); g.addColorStop(0.15, 'rgba(150,150,130,.22)'); g.addColorStop(0.85, 'rgba(150,150,130,.22)'); g.addColorStop(1, 'rgba(150,150,130,0)');
  ctx.fillStyle = g; ctx.fillRect(300, top, 360, VIEW_H);
  ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = Math.floor(top / 52) * 52; y <= top + VIEW_H; y += 52) { ctx.moveTo(320, y); ctx.lineTo(640, y); }
  ctx.stroke();
  // Startlichtung
  const sg = ctx.createRadialGradient(480, -30, 20, 480, -30, 240);
  sg.addColorStop(0, 'rgba(255,214,120,.28)'); sg.addColorStop(1, 'rgba(255,214,120,0)');
  ctx.fillStyle = sg; ctx.fillRect(200, -280, 560, 560);
  ctx.fillStyle = '#ff9a3c'; ctx.beginPath(); ctx.arc(480, 24, 7, 0, 7); ctx.fill();
  // Waldrand
  for (const side of [0, 1]) {
    const gx = side ? VIEW_W : 0, ge = side ? VIEW_W - 26 : 26;
    const eg = ctx.createLinearGradient(gx, 0, ge, 0);
    eg.addColorStop(0, '#040806'); eg.addColorStop(1, 'rgba(4,8,6,0)');
    ctx.fillStyle = eg; ctx.fillRect(Math.min(gx, ge), top, 26, VIEW_H);
  }
  // Deckung
  for (const o of G.obstacles) {
    if (o.y > top + VIEW_H || o.y + o.h < top) continue;
    drawObstacle(o);
  }
  for (const m of G.merchants) drawMerchantWorld(m);
  // Heiltränke
  for (const k of G.pickups) {
    ctx.fillStyle = 'rgba(255,120,150,.25)'; ctx.beginPath(); ctx.arc(k.x, k.y, 20, 0, 7); ctx.fill();
    rr(k.x - 8, k.y - 11, 16, 22, 6); ctx.fillStyle = '#d33a5a'; ctx.fill();
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 2; ctx.stroke();
  }
}

  ctx.fillStyle = g; ctx.fillRect(m.x - 110, m.y - 110, 220, 220);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(m.x - 26, m.y - 6, 70, 36);
  rr(m.x - 30, m.y - 12, 70, 36, 5); ctx.fillStyle = '#6a4a2a'; ctx.fill(); ctx.strokeStyle = '#2a1a0c'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#a8323c'; ctx.fillRect(m.x - 26, m.y - 8, 62, 12);
  ctx.strokeStyle = '#2a1a0c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(m.x - 14, m.y + 4); ctx.lineTo(m.x - 14, m.y + 20); ctx.moveTo(m.x + 14, m.y + 4); ctx.lineTo(m.x + 14, m.y + 20); ctx.stroke();
  ctx.fillStyle = '#ffd978'; ctx.shadowColor = '#ffb040'; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(m.x + 48, m.y - 8, 6, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(m.x + 48, m.y - 2); ctx.lineTo(m.x + 48, m.y + 22); ctx.stroke();
  ctx.fillStyle = '#e0c298'; ctx.strokeStyle = '#2a1a0c'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(m.x - 4, m.y - 26, 11, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3a5a8a'; ctx.beginPath(); ctx.arc(m.x - 4, m.y - 27, 14, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4a6ea6'; ctx.beginPath(); ctx.arc(m.x - 4, m.y - 27, 7, 0, 7); ctx.fill();

function drawObstacle(o) {
  if (o.kind === 'wall') {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(o.x + 4, o.y + 8, o.w, o.h);
    const g = ctx.createLinearGradient(0, o.y, 0, o.y + o.h);
    g.addColorStop(0, '#767e84'); g.addColorStop(1, '#4a5258');
    ctx.fillStyle = g; ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = o.x + 28; x < o.x + o.w; x += 30) { ctx.moveTo(x, o.y); ctx.lineTo(x, o.y + o.h); }
    for (let y = o.y + 24; y < o.y + o.h; y += 24) { ctx.moveTo(o.x, y); ctx.lineTo(o.x + o.w, y); }
    ctx.stroke();
    ctx.strokeStyle = '#1c2226'; ctx.lineWidth = 3; ctx.strokeRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = 'rgba(90,150,80,.5)'; ctx.fillRect(o.x + 4, o.y + 4, o.w * 0.4 * o.seed + 10, 6);
  } else if (o.kind === 'rock') {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(o.x + 4, o.y + 8, o.w, o.h, Math.min(o.w, o.h) * 0.45); ctx.fill();
    const g = ctx.createRadialGradient(o.x + o.w * 0.35, o.y + o.h * 0.3, 4, o.x + o.w / 2, o.y + o.h / 2, Math.max(o.w, o.h) * 0.7);
    g.addColorStop(0, '#9aa2a8'); g.addColorStop(0.6, '#555d63'); g.addColorStop(1, '#2e3438');
    ctx.fillStyle = g; rr(o.x, o.y, o.w, o.h, Math.min(o.w, o.h) * 0.45); ctx.fill();
    ctx.strokeStyle = '#1c2226'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(90,160,80,.45)'; ctx.beginPath(); ctx.ellipse(o.x + o.w * 0.65, o.y + o.h * 0.25, o.w * 0.2, o.h * 0.1, 0, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2 + 5, o.y + o.h / 2 + 9, o.w / 2, o.h / 2, 0, 0, 7); ctx.fill();
    const g = ctx.createRadialGradient(o.x + o.w * 0.38, o.y + o.h * 0.32, 4, o.x + o.w / 2, o.y + o.h / 2, o.w * 0.62);
    g.addColorStop(0, '#4a8a52'); g.addColorStop(0.65, '#235a30'); g.addColorStop(1, '#143a20');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, o.y + o.h / 2, o.w / 2, o.h / 2, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0c2414'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(160,230,150,.18)';
    ctx.beginPath(); ctx.ellipse(o.x + o.w * 0.4, o.y + o.h * 0.35, o.w * 0.14, o.h * 0.1, 0, 0, 7); ctx.fill();
  }
}
function drawEntities() {
  const p = G.player;
  for (const e of G.enemies) {
    if (e.hp <= 0 || !visible(e)) continue;
    if (e.type === 'boss') {
      const r0 = e.r, k = r0 / 14;
      e.r = 14; ctx.save(); ctx.translate(e.x, e.y); ctx.scale(k, k); ctx.translate(-e.x, -e.y); drawSkeleton(e);
      ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, 18, 0, 7); ctx.stroke(); ctx.restore(); e.r = r0;
    } else if (e.type === 'grunt') drawSkeleton(e); else drawGhoul(e);
    if (settings.hpbars) {
      ctx.fillStyle = '#000'; ctx.fillRect(e.x - 14, e.y - e.r - 12, 28, 4);
      ctx.fillStyle = e.state === 'alert' ? '#ff7a8a' : '#d9b13a';
      ctx.fillRect(e.x - 14, e.y - e.r - 12, 28 * Math.max(0, e.hp / e.maxHp), 4);
    }
  }
  for (const f of G.floats) {
    ctx.globalAlpha = Math.min(1, f.t * 3);
    ctx.font = 'bold 16px ' + F_TEXT; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#0a110d'; ctx.strokeText(String(f.v), f.x, f.y);
    ctx.fillStyle = '#fff3c8'; ctx.fillText(String(f.v), f.x, f.y);
    ctx.globalAlpha = 1;
  }
  // Geschosse
  for (const b of G.bullets) {
    if (b.from === 'enemy' && !pointVisible(b.x, b.y)) continue;
    if (b.spell) {
      ctx.shadowColor = '#a89cff'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#e8e2ff'; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(168,156,255,.7)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.04, b.y - b.vy * 0.04); ctx.lineTo(b.x, b.y); ctx.stroke();
      continue;
    }
    ctx.strokeStyle = b.from === 'player' ? '#fff3c8' : '#ff7a7a';
    ctx.lineWidth = b.big ? 6 : 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x - b.vx * (b.big ? 0.05 : 0.016), b.y - b.vy * (b.big ? 0.05 : 0.016)); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const r of G.rings) {
    const f = 1 - r.life / r.max;
    ctx.strokeStyle = 'rgba(200,190,255,' + (1 - f) + ')'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.4 + 0.6 * f), 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(168,156,255,' + (0.25 * (1 - f)) + ')';
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.4 + 0.6 * f), 0, 7); ctx.fill();
  }
  // Kettenblitze
  for (const a of G.arcs) {
    ctx.strokeStyle = '#bfe3ff'; ctx.lineWidth = 2.5; ctx.globalAlpha = Math.min(1, a.life * 8);
    ctx.beginPath(); ctx.moveTo(a.x1, a.y1);
    const mx = (a.x1 + a.x2) / 2 + rand(-10, 10), my = (a.y1 + a.y2) / 2 + rand(-10, 10);
    ctx.lineTo(mx, my); ctx.lineTo(a.x2, a.y2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (const q of G.parts) { ctx.fillStyle = q.color; ctx.globalAlpha = Math.min(1, q.life * 5); ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1;
  drawFigure(G.cls.id, p.x, p.y, p.angle, 1, {
    dash: p.dashT > 0,
    swing: p.swingT > 0 ? 1 - p.swingT / WEAPONS.schwert.swing : -1,
    block: isBlocking(), focus: isFocusing(), med: isMeditating()
  });
}
function drawSkeleton(e) {
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.angle);
  ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(12, 0, 16, -1.1, 1.1); ctx.stroke();
  ctx.strokeStyle = '#d8d0b8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(12 + 16 * Math.cos(-1.1), 16 * Math.sin(-1.1)); ctx.lineTo(12 + 16 * Math.cos(1.1), 16 * Math.sin(1.1)); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = e.hit > 0 ? '#fff' : '#e8dfc4';
  ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#3a3426'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#1c1a14';
  const ca = Math.cos(e.angle), sa = Math.sin(e.angle);
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(e.x + ca * 6 - sa * 5 * s, e.y + sa * 6 + ca * 5 * s, 3.4, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#8ee8ff';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(e.x + ca * 7 - sa * 5 * s, e.y + sa * 7 + ca * 5 * s, 1.3, 0, 7); ctx.fill(); }
}
function drawGhoul(e) {
  ctx.fillStyle = e.hit > 0 ? '#fff' : '#6a7a5a';
  ctx.strokeStyle = '#1c2414'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2 + e.angle, r = i % 2 ? e.r * 0.78 : e.r * 1.35;
    const x = e.x + Math.cos(a) * r, y = e.y + Math.sin(a) * r;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#1c1a14'; ctx.beginPath(); ctx.arc(e.x + Math.cos(e.angle) * 1.5, e.y + Math.sin(e.angle) * 1.5, 2, 0, 7); ctx.fill();
}

// Spielfigur von oben; id bestimmt die Klasse, Blickrichtung = angle
function drawFigure(id, x, y, angle, s, o) {
  o = o || {};
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.scale(s, s);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (id === 'ritter') {
    // Schwert (Schwung oder Ruheposition)
    const w = WEAPONS.schwert, arc = (w.arc + (G && G.cls ? S.arcAdd : 0)) * deg, reach = w.reach * (G && G.cls ? S.reachMul : 1);
    if (o.swing >= 0) {
      const a = -arc / 2 + o.swing * arc;
      ctx.strokeStyle = 'rgba(230,240,255,.35)'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(0, 0, reach * 0.78, -arc / 2, a); ctx.stroke();
      ctx.save(); ctx.rotate(a);
      ctx.strokeStyle = '#e8eef4'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(reach, 0); ctx.stroke();
      ctx.strokeStyle = '#8a6a2a'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(8, -6); ctx.lineTo(8, 6); ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = '#e8eef4'; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(8, 11); ctx.lineTo(34, 8); ctx.stroke();
      ctx.strokeStyle = '#8a6a2a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(8, 6); ctx.lineTo(8, 16); ctx.stroke();
    }
    // Schild
    ctx.fillStyle = '#7a3a3a'; ctx.strokeStyle = '#d2dae2'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (o.block) ctx.ellipse(20, 0, 7, 19, 0, 0, 7); else ctx.ellipse(2, -15, 9, 6, 0.5, 0, 7);
    ctx.fill(); ctx.stroke();
    if (o.block) { ctx.fillStyle = '#d2dae2'; ctx.beginPath(); ctx.arc(20, 0, 3, 0, 7); ctx.fill(); }
    // Körper, Helm
    ctx.fillStyle = o.dash ? '#6fe0a0' : '#8a929a'; ctx.strokeStyle = '#2a3036'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#b8c0c8'; ctx.beginPath(); ctx.arc(1, 0, 10, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#2a3036'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(6, 6); ctx.stroke();
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.ellipse(-8, 0, 7, 3.5, 0, 0, 7); ctx.fill();
  } else if (id === 'magier') {
    // Stab mit Kristall
    ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(2, 11); ctx.lineTo(34, 11); ctx.stroke();
    const glow = o.med ? 14 : 10;
    ctx.shadowColor = '#a89cff'; ctx.shadowBlur = glow * 1.5;
    ctx.fillStyle = '#e8e2ff'; ctx.beginPath(); ctx.arc(36, 11, o.med ? 6.5 : 5, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    // Körper, Hut
    ctx.fillStyle = o.dash ? '#6fe0a0' : '#3a2f7a'; ctx.strokeStyle = '#150f3a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4a3a9a'; ctx.beginPath(); ctx.arc(-1, 0, 19, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5e4cb4'; ctx.beginPath(); ctx.arc(-3, 0, 11, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.arc(-3, 0, 3, 0, 7); ctx.fill();
    if (o.med) { ctx.strokeStyle = 'rgba(168,156,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 26, 0, 7); ctx.stroke(); }
  } else {
    // Waldläufer: Armbrust
    ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(28, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, -11); ctx.lineTo(18, 11); ctx.stroke();
    ctx.strokeStyle = '#d8d0b8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(18, -11); ctx.lineTo(8, 0); ctx.lineTo(18, 11); ctx.stroke();
    ctx.fillStyle = o.dash ? '#6fe0a0' : '#2f5a3a';
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0c2414'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#244a2e';
    ctx.beginPath(); ctx.moveTo(-10, -9); ctx.lineTo(-10, 9); ctx.lineTo(2, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e0c298'; ctx.beginPath(); ctx.arc(2, 0, 6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0c2414'; ctx.lineWidth = 1.5; ctx.stroke();
    if (o.focus) { ctx.strokeStyle = 'rgba(79,208,138,.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 24, 0, 7); ctx.stroke(); }
  }
  ctx.restore();
}

function drawFogInto() {
  const p = G.player, V = visionParams(), segs = obstacleSegments();
  const cone = visPoly(p.x, p.y, p.angle, V.fov / 2, V.range, segs, 0.006);
  const ring = visPoly(p.x, p.y, 0, Math.PI, V.near, segs, 0.05);
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0, 0, fog.width, fog.height);
  fctx.fillStyle = 'rgba(3,8,10,0.70)';
  fctx.fillRect(FIELD_X * scale, 0, VIEW_W * scale, VIEW_H * scale);
  fctx.globalCompositeOperation = 'destination-out';
  fctx.setTransform(scale, 0, 0, scale, FIELD_X * scale, -G.camTop * scale);
  fctx.fillStyle = '#000';
  for (const poly of [cone, ring]) {
    fctx.beginPath();
    poly.forEach((pt, i) => i ? fctx.lineTo(pt[0], pt[1]) : fctx.moveTo(pt[0], pt[1]));
    fctx.closePath(); fctx.fill();
  }
}

function drawCrosshair() {
  const p = G.player, w = W();
  const x = mouse.fx, y = mouse.fy, st = settings.xhair;
  ctx.strokeStyle = settings.xcol; ctx.fillStyle = settings.xcol; ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (w.type === 'melee') {
    if (st === 1) { ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); return; }
    ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.stroke();
    ctx.fillRect(x - 1, y - 1, 2, 2);
    return;
  }
  const dist = Math.hypot(mouse.x - p.x, mouse.y + G.camTop - p.y);
  const gap = clamp(Math.tan(currentSpread() * deg) * dist, 5, 70);
  if (st === 1) { ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
  else if (st === 2) { ctx.beginPath(); ctx.arc(x, y, gap + 4, 0, 7); ctx.stroke(); ctx.fillRect(x - 1, y - 1, 2, 2); }
  else {
    ctx.beginPath();
    ctx.moveTo(x - gap - 8, y); ctx.lineTo(x - gap, y);
    ctx.moveTo(x + gap, y); ctx.lineTo(x + gap + 8, y);
    ctx.moveTo(x, y - gap - 8); ctx.lineTo(x, y - gap);
    ctx.moveTo(x, y + gap); ctx.lineTo(x, y + gap + 8);
    ctx.stroke();
    ctx.fillRect(x - 1, y - 1, 2, 2);
  }
  if (p.reloadT > 0) {
    const f = 1 - p.reloadT / (w.reloadTime * S.reloadMul);
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, gap + 16, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); ctx.stroke();
  }
}

function bookLayout() {
  const cls = CLASSES[bookClass];
  const L = { tabs: [], chips: [], items: [], rows: [] };
  CLASSES.forEach((c, i) => L.tabs.push({ i, x: 400 + i * 168, y: 18, w: 158, h: 42 }));
  L.back = { x: 40, y: 18, w: 120, h: 42 }; L.recycle = { x: 1060, y: 18, w: 180, h: 42 };
  L.chips = [{ id: 'usable', label: 'Nutzbar', x: 650, y: 104, w: 96, h: 32 }, { id: 'all', label: 'Alle', x: 754, y: 104, w: 66, h: 32 }];
  const list = CARDS.filter(c => bookFilter === 'all' || compat(c, cls));
  L.pages = Math.max(1, Math.ceil(list.length / 10));
  bookPage = clamp(bookPage, 0, L.pages - 1);
  list.slice(bookPage * 10, bookPage * 10 + 10).forEach((c, i) => {
    L.items.push({ c, x: 40 + (i % 5) * 160, y: 150 + Math.floor(i / 5) * 226, w: 146, h: 212 });
  });
  L.prev = { x: 300, y: 614, w: 44, h: 34 }; L.next = { x: 440, y: 614, w: 44, h: 34 };
  const d = deckOf(cls), ids = [...new Set(d)];
  ids.forEach((id, i) => L.rows.push({ id, n: d.filter(x => x === id).length, x: 876, y: 176 + i * 36, w: 348, h: 30, minus: { x: 1190, y: 177 + i * 36, w: 28, h: 28 } }));
  L.clear = { x: 880, y: 640, w: 160, h: 38 }; L.auto = { x: 1060, y: 640, w: 160, h: 38 };
  return L;
}
const hitR = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function bookHit(x, y) {

function buyPack(p) {
  if (!packUnlocked(p) || SAVE.silver < p.price) return;
  const roll = () => {
    let r = Math.random() * 100, idx = 0;
    for (; idx < 3; idx++) { r -= p.odds[idx]; if (r < 0) break; }
    return idx;
  };
  const idxs = Array.from({ length: 5 }, roll);
  if (p.min) {
    const mi = RARITY_KEYS.indexOf(p.min);
    if (!idxs.some(i => i >= mi)) idxs[idxs.length - 1] = mi;
  }
  idxs.sort((a, b) => a - b);
  const seen = {};
  const cards = idxs.map(i => {
    const pool = CARDS.filter(c => c.rarity === RARITY_KEYS[i]);
    const c = pool[Math.floor(Math.random() * pool.length)];
    const isNew = (SAVE.owned[c.id] || 0) === 0 && !seen[c.id];
    seen[c.id] = true;
    return { c, isNew, t: 0 };
  });
  SAVE.silver -= p.price;
  for (const it of cards) SAVE.owned[it.c.id] = (SAVE.owned[it.c.id] || 0) + 1;
  persist();
  sfx('pack_buy');
  packOpen = { pack: p, cards };
  state = 'open';
}

function draw() {
  if (state !== 'dead') fbEl.name.classList.remove('on');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#0a110d'; ctx.fillRect(0, 0, FRAME_W, FRAME_H);

  if (state === 'shop') { drawShopScreen(); drawCursor(); return; }
  if (state === 'open') { drawOpenScreen(); drawCursor(); return; }
  if (state === 'recycle') { drawRecycleScreen(); drawCursor(); return; }
  if (isPanel(state) && (panelFrom === 'menu' || !G)) { drawMenu(); overlay(0.8); drawPanelScreen(); if (state !== 'feedback') drawCursor(); return; }
  if (state === 'menu' || !G && state !== 'select') { drawMenu(); drawCursor(); return; }
  if (state === 'select') { drawSelectScreen(); drawCursor(); return; }

  ctx.save();
  ctx.beginPath(); ctx.rect(FIELD_X, 0, VIEW_W, VIEW_H); ctx.clip();
  ctx.translate(FIELD_X, -G.camTop);
  if (G.shakeT > 0 && settings.hitfx) ctx.translate((Math.random() - 0.5) * G.shakeT * 20 * settings.hitfx / 2, (Math.random() - 0.5) * G.shakeT * 20 * settings.hitfx / 2);
  drawWorld();
  drawEntities();
  ctx.restore();
  drawFogInto();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(fog, 0, 0); ctx.restore();
  ctx.save(); ctx.translate(FIELD_X, 0);
  ctx.beginPath(); ctx.rect(0, 0, VIEW_W, VIEW_H); ctx.clip();
  drawFieldHUD();
  ctx.restore();
  drawRails();

  if (state === 'play') drawCrosshair();
  if (state === 'pause') { drawPauseScreen(); drawCursor(); }
  if (isPanel(state)) { overlay(0.86); drawPanelScreen(); if (state !== 'feedback') drawCursor(); }
  if (state === 'pick') { drawPickScreen(); drawCursor(); }
  if (state === 'merchant') { drawMerchantScreen(); drawCursor(); }
  if (state === 'dead') drawDeadScreen();
}

  if (ctx.measureText(str).width <= maxW) return str;
  while (str.length > 1 && ctx.measureText(str + '…').width > maxW) str = str.slice(0, -1);

}

  const t = fbEl.title.value.trim();
  if (!t) { fb.msg = 'Bitte zuerst einen Titel eingeben.'; fb.kind = 'err'; return; }
  const url = 'https://github.com/' + FEEDBACK_REPO + '/issues/new?title=' + encodeURIComponent(t) + '&body=' + encodeURIComponent(feedbackBody().slice(0, 5000));
  window.open(url, '_blank', 'noopener');
}
async function sendFeedback() {
  if (fb.busy) return;
  if (FEEDBACK_ENDPOINT) return sendViaService();
  const title = fbEl.title.value.trim(), token = (fb.tokenEdit || !ghToken ? fbEl.token.value.trim() : '') || ghToken;
  if (!title) { fb.msg = 'Bitte einen Titel eingeben.'; fb.kind = 'err'; return; }
  if (!token) { fb.msg = 'Zum direkten Senden fehlt der GitHub-Zugangstoken. Alternativ: „Im Browser öffnen“.'; fb.kind = 'err'; return; }
  fb.busy = true; fb.msg = 'Sende …'; fb.kind = ''; fb.url = '';
  const payload = { title, body: feedbackBody(), labels: ['feedback'] };
  const post = p => fetch('https://api.github.com/repos/' + FEEDBACK_REPO + '/issues', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
    body: JSON.stringify(p)
  });
  try {
    let res = await post(payload);
    if (res.status === 422) { delete payload.labels; res = await post(payload); }
    if (res.ok) {
      const j = await res.json();
      fb.msg = 'Danke! Issue #' + j.number + ' wurde angelegt.'; fb.kind = 'ok'; fb.url = j.html_url || '';
      fbEl.title.value = ''; fbEl.body.value = '';
      if (token !== ghToken) { ghToken = token; try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {} }
      fbEl.token.value = ''; fb.tokenEdit = false;
      sfx('card_pick');
    } else {
      fb.kind = 'err';
      fb.msg = res.status === 401 ? 'Der Zugangstoken wurde abgelehnt (ungültig oder abgelaufen).'
        : res.status === 403 ? 'Keine Berechtigung. Der Token braucht „Issues: Read and write“ für ' + FEEDBACK_REPO + '.'
        : res.status === 404 ? 'Repository nicht gefunden – oder der Token hat keinen Zugriff darauf.'
        : 'GitHub hat den Eintrag abgelehnt (Status ' + res.status + ').';
    }
  } catch (e) { fb.kind = 'err'; fb.msg = 'Keine Verbindung zu GitHub. Prüfe das Netz oder nutze „Im Browser öffnen“.'; }
  fb.busy = false;
}
async function sendViaService() {
  const title = fbEl.title.value.trim(), name = fbEl.token.value.trim();
  if (!title) { fb.msg = 'Bitte einen Titel eingeben.'; fb.kind = 'err'; return; }
  fb.busy = true; fb.msg = 'Sende …'; fb.kind = ''; fb.url = '';
  try {
    const res = await fetch(FEEDBACK_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, body: feedbackBody(), name }) });
    const j = await res.json().catch(() => ({}));
    if (res.ok) {
      fb.msg = 'Danke! Dein Feedback wurde gesendet (Issue #' + j.number + ').'; fb.kind = 'ok';
      fbEl.title.value = ''; fbEl.body.value = ''; sfx('card_pick');
      try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
    } else { fb.kind = 'err'; fb.msg = res.status === 429 ? 'Zu viele Nachrichten – bitte in einer Minute noch einmal.' : (j.error || 'Das Senden hat nicht geklappt (Status ' + res.status + ').'); }
  } catch (e) { fb.kind = 'err'; fb.msg = 'Keine Verbindung zum Feedback-Dienst.'; }
  fb.busy = false;
}
function drawFeedbackScreen() {
  uiBtns = []; uiSliders = [];
  const X = 240, Y = 48, Wd = 800, Ht = 624;
  windowFrame(X, Y, Wd, Ht);
  kicker('Rückmeldung', 276, 100);
  titleText('Feedback', 276, 152, 44);
  text(FEEDBACK_ENDPOINT ? 'Geht direkt an den Entwickler' : 'Landet direkt als Issue auf GitHub', 1004, 148, 15, '#8a9aa0', 'right', F_TEXT);
  text('Titel', 276, 190, 18, '#f0e6c8');
  text('Beschreibung', 276, 274, 18, '#f0e6c8');
  text('Idee, Fehler oder Beobachtung – gern ausführlich', 1004, 274, 14, '#8a9aa0', 'right', F_TEXT);

  } else if (hasTok) {
    text('✓ GitHub-Zugang gespeichert (nur in diesem Browser)', 276, 506, 17, '#4fd08a');
    uiButton(676, 482, 100, 34, 'Ändern', () => { fb.tokenEdit = true; setTimeout(() => fbEl.token.focus(), 0); }, { size: 14 });
    uiButton(786, 482, 110, 34, 'Entfernen', () => { ghToken = ''; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }, { size: 14 });
  } else {
    text('GitHub-Zugangstoken (einmalig)', 276, 474, 18, '#f0e6c8');
    if (ghToken) uiButton(846, 482, 110, 36, 'Behalten', () => { fb.tokenEdit = false; fbEl.token.value = ''; }, { size: 14 });
    wrap('Fine-grained Token mit Zugriff nur auf ' + FEEDBACK_REPO + ' und „Issues: Read and write“. Er bleibt ausschließlich in diesem Browser gespeichert.', 728, '14px ' + F_TEXT)
      .forEach((l, i) => text(l, 276, 542 + i * 18, 14, '#8a9aa0'));
  }
  if (fb.msg) {
    const col = fb.kind === 'ok' ? '#4fd08a' : fb.kind === 'err' ? '#ff7a8a' : '#c8d4de';
    wrap(fb.msg, fb.url ? 560 : 728, '16px ' + F_TEXT).slice(0, 2).forEach((l, i) => text(l, 276, 580 + i * 19, 16, col));
    if (fb.url) uiButton(854, 566, 150, 32, 'Issue ansehen', () => window.open(fb.url, '_blank', 'noopener'), { size: 14 });
  }
  uiButton(276, 606, 150, 48, 'Abbrechen', closeFeedback, { size: 17 });
  uiButton(440, 606, 230, 48, 'Im Browser öffnen', openInBrowser, { size: 17 });
  uiButton(1004 - 200, 606, 200, 48, fb.busy ? 'Sende …' : 'Senden', sendFeedback, { primary: true, size: 18, disabled: fb.busy });
}
function drawPanelScreen() {
  if (state === 'options') drawOptionsScreen(); else if (state === 'controls') drawControlsScreen(); else drawFeedbackScreen();
}
applySettings();

// ---------- Rangliste ----------
const SCORES_URL = FEEDBACK_ENDPOINT ? FEEDBACK_ENDPOINT + '/scores' : '';
const board = { list: null, err: false, at: 0, loading: false };
let scoreSt = { run: null };
const runScore = () => Math.floor(G.dist) + G.kills * 3 + (G.won ? 500 : 0);
const savedName = () => { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } };
async function loadBoard() {
  if (!SCORES_URL || board.loading) return;
  board.loading = true; board.at = performance.now();
  try {
    const res = await fetch(SCORES_URL);
    if (!res.ok) throw 0;
    board.list = (await res.json()).scores || []; board.err = false;
  } catch (e) { board.err = true; }
  board.loading = false;
}
async function submitScore() {
  const run = G;
  if (!SCORES_URL || CHEAT || scoreSt.busy || scoreSt.done) return;
  const name = fbEl.name.value.trim();
  if (!name) { scoreSt.msg = 'Bitte einen Namen eingeben.'; scoreSt.kind = 'err'; return; }
  scoreSt.busy = true; scoreSt.msg = 'Speichere …'; scoreSt.kind = '';
  try {
    const res = await fetch(SCORES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, cls: run.cls.id, dist: Math.floor(run.dist), kills: run.kills, won: run.won }) });
    const j = await res.json().catch(() => ({}));
    if (res.ok) {
      try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
      if (j.scores) { board.list = j.scores; board.err = false; board.at = performance.now(); }
      scoreSt.done = true; scoreSt.kind = 'ok'; fbEl.name.blur();
      scoreSt.msg = j.best ? 'Eingetragen: Platz ' + j.rank + '!' : 'Dein bisheriger Rekord ist besser und bleibt stehen.';
      sfx('card_pick');
    } else { scoreSt.kind = 'err'; scoreSt.msg = res.status === 429 ? 'Zu viele Einträge – bitte kurz warten.' : (j.error || 'Das Speichern hat nicht geklappt.'); }
  } catch (e) { scoreSt.kind = 'err'; scoreSt.msg = 'Keine Verbindung zur Rangliste.'; }
  scoreSt.busy = false;
}
function leaveDead() { fbEl.name.blur(); state = 'menu'; }
function drawDeadScreen() {
  uiBtns = [];
  if (scoreSt.run !== G) { scoreSt = { run: G, busy: false, done: false, msg: '', kind: '', t0: performance.now() }; fbEl.name.value = savedName(); }
  overlay(0.8);
  const form = !!SCORES_URL && !CHEAT && !scoreSt.done;
  text(G.won ? 'Der Weg ist frei' : G.gaveUp ? 'Aufgegeben' : 'Gefallen', 640, 200, 56, G.won ? '#4fd08a' : G.gaveUp ? '#f2c14e' : '#ff7a8a', 'center', F_TITLE);
  text(G.cls.name + ' · ' + Math.floor(G.dist) + ' m · ' + G.kills + ' Gefallene · ' + G.cards.length + ' Karten', 640, 252, 24, '#f0e6c8', 'center', F_TEXT);
  text('Rekord: ' + Math.floor(best) + ' m   ·   + ' + G.earned + ' Mondsilber', 640, 290, 19, '#b8c4d0', 'center', F_TEXT);
  titleText(runScore() + ' Punkte', 640, 352, 40, 'center');
  if (G.won) text('Weg + 3 je Gefallenem + 500 Siegbonus', 640, 380, 15, '#8a9aa0', 'center', F_TEXT);
  else text('Weg + 3 je Gefallenem', 640, 380, 15, '#8a9aa0', 'center', F_TEXT);
  if (SCORES_URL && CHEAT) text('Testmodus: kein Eintrag in die Rangliste', 640, 470, 17, '#8a9aa0', 'center', F_TEXT, 'italic');
  if (form) {
    text('Dein Name für die Rangliste', 640, 446, 18, '#f0e6c8', 'center', F_TEXT);
    fbPlace(fbEl.name, { x: 430, y: 462, w: 280, h: 44 }, true);
    uiButton(724, 462, 126, 44, scoreSt.busy ? '…' : 'Eintragen', submitScore, { primary: true, size: 16, disabled: scoreSt.busy });
  } else fbEl.name.classList.remove('on');
  if (scoreSt.msg) text(scoreSt.msg, 640, 540, 18, scoreSt.kind === 'ok' ? '#4fd08a' : scoreSt.kind === 'err' ? '#ff7a8a' : '#c8d4de', 'center', F_TEXT);
  uiButton(540, 572, 200, 46, form ? 'Überspringen' : 'Zum Menü', leaveDead, { size: 17, primary: !form });
  drawCursor();
}
function drawBoard() {
  if (!SCORES_URL) return;
  if (!board.loading && performance.now() - board.at > 30000) loadBoard();
  const x = 890, y = 272, w = 350, h = 392;
  rr(x, y, w, h, 14); ctx.fillStyle = 'rgba(10,17,13,.86)'; ctx.fill(); ctx.strokeStyle = '#9a7a3a'; ctx.lineWidth = 2; ctx.stroke();
  text('Rangliste', x + 20, y + 36, 22, '#f2c14e', 'left', F_TITLE);
  text('Punkte', x + w - 18, y + 34, 13, '#8a9aa0', 'right', F_TEXT);
  ctx.fillStyle = '#2e3e32'; ctx.fillRect(x + 16, y + 46, w - 32, 1);
  const me = savedName().toLowerCase();
  if (!board.list) text(board.err ? 'Rangliste nicht erreichbar' : 'Lädt …', x + w / 2, y + 120, 17, '#8a9aa0', 'center', F_TEXT, 'italic');
  else if (!board.list.length) text('Noch keine Einträge – sei der Erste!', x + w / 2, y + 120, 17, '#8a9aa0', 'center', F_TEXT, 'italic');
  else board.list.slice(0, 10).forEach((e, i) => {
    const ry = y + 76 + i * 33, mine = me && e.name.toLowerCase() === me, col = mine ? '#f2c14e' : '#e8dcbc';
    text(String(i + 1), x + 20, ry, 17, i < 3 ? '#f2c14e' : '#8a9aa0', 'left', F_TITLE);
    text(fit(e.name, 150, '17px ' + F_TEXT) + (e.won ? ' ✓' : ''), x + 52, ry, 17, col, 'left', F_TEXT, mine ? 'bold' : '');
    text(e.dist + ' m', x + w - 92, ry, 14, '#8a9aa0', 'right', F_TEXT);
    text(String(e.score), x + w - 18, ry, 17, col, 'right', F_TITLE);
  });
}

// ---------- Eingabe ----------
function toSelect() { selectHover = lastClass; state = 'select'; }
addEventListener('keydown', e => {
  audioInit();
  if (e.target === fbEl.name) { if (e.code === 'Enter') submitScore(); else if (e.code === 'Escape') leaveDead(); return; }
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) {
    if (e.code === 'Escape') closeFeedback();
    else if (e.code === 'Enter' && (e.ctrlKey || e.metaKey)) sendFeedback();
    return;
  }
  if (state === 'controls' && listenAct) { e.preventDefault(); bindKey(e.code); return; }
  if (e.code === bind('music')) { audioPrefs.music = !audioPrefs.music; applyAudioPrefs(); }
  if (e.code === bind('sfx')) { audioPrefs.sfx = !audioPrefs.sfx; applyAudioPrefs(); }
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (state === 'menu' && (e.code === 'Enter' || e.code === 'Space')) { toSelect(); return; }
  if (state === 'dead') {
    if (e.code === 'Escape') leaveDead();
    else if (e.code === 'Enter' && performance.now() - (scoreSt.t0 || 0) > 700) {
      if (SCORES_URL && !CHEAT && !scoreSt.done) { if (fbEl.name.value.trim()) submitScore(); else fbEl.name.focus(); } else leaveDead();
    }
    return;
  }
  if (state === 'options') { if (e.code === 'Escape') closePanel(); return; }
  if (state === 'controls') { if (e.code === 'Escape') state = 'options'; return; }
  if (state === 'feedback') { if (e.code === 'Escape') closeFeedback(); return; }
  if (state === 'shop') { if (e.code === 'Escape') state = 'menu'; return; }
  if (state === 'recycle') { if (e.code === 'Escape') state = 'book'; if (e.code === 'ArrowRight') recyclePage++; if (e.code === 'ArrowLeft') recyclePage--; return; }
  if (state === 'open') { if (e.code === 'Escape' && packOpen && packOpen.cards.every(it => it.t)) { state = 'shop'; packOpen = null; } return; }
  if (state === 'book') {
    if (e.code === 'Escape') state = 'menu';
    if (/^Digit[1-3]$/.test(e.code)) { bookClass = Number(e.code.slice(5)) - 1; bookPage = 0; }
    if (e.code === 'ArrowRight') bookPage++;
    if (e.code === 'ArrowLeft') bookPage--;
    return;
  }
  if (state === 'select') {
    if (/^Digit[1-9]$/.test(e.code)) { const i = Number(e.code.slice(5)) - 1; if (CLASSES[i]) startRun(i); return; }
    if (e.code === 'Enter' || e.code === 'Space') { startRun(selectHover >= 0 ? selectHover : lastClass); return; }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') selectHover = (Math.max(selectHover, 0) + CLASSES.length - 1) % CLASSES.length;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') selectHover = (Math.max(selectHover, 0) + 1) % CLASSES.length;
    if (e.code === 'Escape') state = 'menu';
    return;
  }
  if (state === 'merchant') { if (e.code === 'Escape' || e.code === bind('interact')) { state = 'play'; merchantNow = null; G.player.invuln = 0.5; } return; }
  if (state === 'play') {
    if (e.code === bind('interact')) { const nm = nearMerchant(); if (nm) { openMerchant(nm); return; } }
    if (e.code === bind('reload')) startReload();
    if (e.code === bind('dash')) tryDash();
  }
  if (state === 'pick' && /^Digit[1-4]$/.test(e.code)) choosePick(Number(e.code.slice(5)) - 1);
  if ((e.code === 'Escape' || e.code === 'KeyP') && (state === 'play' || state === 'pause')) { if (state === 'play') state = 'pause'; else resumeRun(); }
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; mouse.rdown = false; mouse.pressed = false; if (state === 'play' && settings.autoPause) state = 'pause'; setBgQuiet(true); });
addEventListener('focus', () => setBgQuiet(false));
document.addEventListener('visibilitychange', () => setBgQuiet(document.hidden));
addEventListener('mousemove', e => { if (dragSlider) { setMouse(e); sliderSet(dragSlider); } });
function setMouse(e) {
  const r = canvas.getBoundingClientRect();
  mouse.fx = (e.clientX - r.left) / r.width * FRAME_W;
  mouse.fy = (e.clientY - r.top) / r.height * FRAME_H;
  mouse.x = mouse.fx - FIELD_X;
  mouse.y = mouse.fy;
  if (state === 'book') bookHover = bookHit(mouse.fx, mouse.fy);
  if (state === 'menu') menuHover = menuButtons.findIndex(b => mouse.fx >= b.x && mouse.fx <= b.x + b.w && mouse.fy >= b.y && mouse.fy <= b.y + b.h);
  if (state === 'pick') pickHover = pickLayout().findIndex(L => mouse.fx >= L.x && mouse.fx <= L.x + L.w && mouse.fy >= L.y && mouse.fy <= L.y + L.h);
  if (state === 'select') {
    const hit = selectLayout().find(L => mouse.fx >= L.x && mouse.fx <= L.x + L.w && mouse.fy >= L.y && mouse.fy <= L.y + L.h);
    selectHover = hit ? hit.i : (mouse.fx >= 40 && mouse.fx <= 160 && mouse.fy >= 36 && mouse.fy <= 76 ? -2 : selectHover === -2 ? -1 : selectHover);
    if (hit) selectHover = hit.i;
  }
}
canvas.addEventListener('mousemove', setMouse);
canvas.addEventListener('mousedown', e => {
  audioInit();
  setMouse(e);
  if (state === 'pause' || isPanel(state)) {
    if (e.button !== 0) return;
    const sl = uiSliders.find(q => mouse.fx >= q.x && mouse.fx <= q.x + q.w && mouse.fy >= q.y && mouse.fy <= q.y + q.h);
    if (sl) { dragSlider = sl; sliderSet(sl); } else uiClick();
    return;
  }
  if (state === 'play') {
    if (e.button === 2) mouse.rdown = true;
  }
  if (state === 'book') { bookClick(bookHit(mouse.fx, mouse.fy), e.button === 2); return; }
  if (state === 'shop' || state === 'open' || state === 'recycle' || state === 'merchant') { if (e.button === 0) uiClick(); return; }
  if (e.button !== 0) return;
  if (state === 'menu') { const b = menuButtons[menuHover]; if (b && b.action) { sfx('ui_click'); b.action(); } return; }
  if (state === 'select') {
    if (selectHover === -2) { state = 'menu'; return; }
    if (selectHover >= 0) { sfx('ui_click'); startRun(selectHover); }
    return;
  }
  if (state === 'dead') { uiClick(); return; }
  if (state === 'pick') { if (pickHover >= 0) choosePick(pickHover); return; }
  mouse.down = true; mouse.pressed = true;
});
addEventListener('mouseup', e => { if (e.button === 0) { mouse.down = false; mouse.pressed = false; dragSlider = null; } if (e.button === 2) mouse.rdown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  if (state === 'book') { bookPage += e.deltaY > 0 ? 1 : -1; e.preventDefault(); }
  if (state === 'recycle') { recyclePage += e.deltaY > 0 ? 1 : -1; e.preventDefault(); }
}, { passive: false });

// ---------- Hauptschleife ----------
let last = 0;
function loop(t) {
  const dt = Math.min((t - (last || t)) / 1000, 0.05);
  last = t;
  update(dt);
  updateMusicIntensity(dt);
  musicFor(state);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
