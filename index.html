// ---------- Hilfsfunktionen ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const normAngle = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const deg = Math.PI / 180;

function segRect(x1, y1, x2, y2, r) {
  let tmin = 0, tmax = 1;
  const dx = x2 - x1, dy = y2 - y1;
  if (Math.abs(dx) < 1e-9) { if (x1 < r.x || x1 > r.x + r.w) return Infinity; }
  else {
    let t1 = (r.x - x1) / dx, t2 = (r.x + r.w - x1) / dx;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return Infinity;
  }
  if (Math.abs(dy) < 1e-9) { if (y1 < r.y || y1 > r.y + r.h) return Infinity; }
  else {
    let t1 = (r.y - y1) / dy, t2 = (r.y + r.h - y1) / dy;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return Infinity;
  }
  return tmin;
}
function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1, fx = x1 - cx, fy = y1 - cy;
  const a = dx * dx + dy * dy;
  if (a < 1e-9) return Infinity;
  const b = 2 * (fx * dx + fy * dy), c = fx * fx + fy * fy - r * r;
  let disc = b * b - 4 * a * c;
  if (disc < 0) return Infinity;
  disc = Math.sqrt(disc);
  let t = (-b - disc) / (2 * a);
  if (t < 0) { t = (-b + disc) / (2 * a); if (t < 0) return Infinity; }
  return t <= 1 ? t : Infinity;
}
function rayDist(ox, oy, dx, dy, maxD, segs) {
  let best = maxD;
  for (const s of segs) {
    const sx = s[2] - s[0], sy = s[3] - s[1];
    const den = dx * sy - dy * sx;
    if (Math.abs(den) < 1e-9) continue;
    const t = ((s[0] - ox) * sy - (s[1] - oy) * sx) / den;
    if (t < 0 || t >= best) continue;
    const u = ((s[0] - ox) * dy - (s[1] - oy) * dx) / den;
    if (u >= 0 && u <= 1) best = t;
  }
  return best;
}

// ---------- Level-Generierung ----------
function rectsGap(a, b, gap) {
  return a.x < b.x + b.w + gap && a.x + a.w + gap > b.x && a.y < b.y + b.h + gap && a.y + a.h + gap > b.y;
}
function freeSpot(r, tries = 40, y0, y1) {
  for (let i = 0; i < tries; i++) {
    const x = rand(60, WORLD_W - 60), y = rand(y0, y1);
    let ok = true;
    for (const o of G.obstacles) {
      const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
      if ((x - cx) ** 2 + (y - cy) ** 2 < (r + 24) ** 2) { ok = false; break; }
    }
    if (ok) return { x, y };
  }
  return null;
}
function makeEnemy(type, x, y, alert) {
  const t = ENEMY_TYPES[type];
  return {
    type, x, y, r: t.r, hp: t.hp, maxHp: t.hp,
    angle: rand(-Math.PI, Math.PI),
    state: alert ? 'alert' : 'idle',
    reaction: alert ? 0.4 : 0.7,
    cooldown: rand(0.5, 1.5), burst: 0, strafe: Math.random() < 0.5 ? 1 : -1, strafeT: rand(1, 2.5),
    lastX: G.player.x, lastY: G.player.y, lostT: 0, stuckT: 0, steerT: 0, steerDir: 1, hit: 0, melee: 0
  };
}
function generate() {
  while (G.genTop > G.camTop - CHUNK_H) {
    const y1 = G.genTop, y0 = G.genTop - CHUNK_H;
    const k = Math.round(-y1 / CHUNK_H);
    // Deckung: Ruinenmauern, Felsen, Bäume
    const count = k === 0 ? 4 : Math.floor(rand(6, 10));
    for (let i = 0; i < count; i++) {
      for (let t = 0; t < 30; t++) {
        const r = Math.random();
        const kind = r < 0.4 ? 'wall' : r < 0.7 ? 'rock' : 'tree';
        let w = rand(60, 170), h = rand(40, 120);
        if (kind === 'tree') { w = rand(64, 104); h = w; }
        const o = { kind, seed: Math.random(), x: rand(70, WORLD_W - 70 - w), y: rand(y0 + 30, y1 - h - 30), w, h };
        if (k === 0 && o.y + o.h > -230 && o.x < 700 && o.x + o.w > 260) continue;
        if (G.obstacles.some(p => rectsGap(o, p, 80))) continue;
        G.obstacles.push(o);
        break;
      }
    }
    // Gegner fest in der Welt
    if (k > 0) {
      const n = Math.min(2 + Math.floor(k * 0.6), 9);
      for (let i = 0; i < n; i++) {
        const spot = freeSpot(14, 40, y0 + 40, y1 - 40);
        if (!spot) continue;
        const rushP = Math.min(0.25 + k * 0.02, 0.45);
        const group = Math.random() < 0.35 ? 2 + Math.floor(Math.random() * 2) : 1;
        for (let g = 0; g < group; g++) {
          const type = Math.random() < rushP ? 'rusher' : 'grunt';
          const gx = clamp(spot.x + rand(-60, 60), 40, WORLD_W - 40), gy = spot.y + rand(-40, 40);
          if (G.obstacles.some(o => gx > o.x - 20 && gx < o.x + o.w + 20 && gy > o.y - 20 && gy < o.y + o.h + 20)) continue;
          G.enemies.push(makeEnemy(type, gx, gy, false));
        }
      }
    }
    // Heiltrank
    if (k > 0 && Math.random() < 0.5) {
      const s = freeSpot(14, 30, y0 + 40, y1 - 40);
      if (s) G.pickups.push({ x: s.x, y: s.y, heal: 30 });
    }
    G.genTop = y0;
  }
}

// ---------- Kollision ----------
function resolve(e) {
  for (const o of G.obstacles) {
    if (o.y > e.y + 80 || o.y + o.h < e.y - 80) continue;
    const cx = clamp(e.x, o.x, o.x + o.w), cy = clamp(e.y, o.y, o.y + o.h);
    const dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;
    if (d2 >= e.r * e.r) continue;
    if (d2 > 1e-6) {
      const d = Math.sqrt(d2);
      e.x += dx / d * (e.r - d); e.y += dy / d * (e.r - d);
    } else {
      const l = e.x - o.x, r = o.x + o.w - e.x, t = e.y - o.y, b = o.y + o.h - e.y, m = Math.min(l, r, t, b);
      if (m === l) e.x = o.x - e.r; else if (m === r) e.x = o.x + o.w + e.r;
      else if (m === t) e.y = o.y - e.r; else e.y = o.y + o.h + e.r;
    }
  }
  e.x = clamp(e.x, e.r, WORLD_W - e.r);
}
function moveCircle(e, dx, dy) {
  const ox = e.x, oy = e.y;
  e.x += dx; resolve(e);
  e.y += dy; resolve(e);
  return Math.hypot(e.x - ox, e.y - oy);
}
function hasLOS(x1, y1, x2, y2) {
  for (const o of G.obstacles) {
    if (Math.min(y1, y2) > o.y + o.h || Math.max(y1, y2) < o.y) continue;
    if (segRect(x1, y1, x2, y2, o) !== Infinity) return false;
  }
  return true;
}

// ---------- Angriffe ----------
function currentSpread() {
  const p = G.player, w = W();
  if (w.type === 'melee') return 0;
  const mv = Math.min(1, p.speed / S.moveSpeed);
  return (w.spread + p.bloom + w.moveSpread * mv) * S.spreadMul * (isFocusing() ? 0.5 : 1);   // Grad
}
function addBullet(x, y, angle, speed, dmg, from, range, pierce, extra) {
  G.bullets.push(Object.assign({ x, y, px: x, py: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, dmg, from, life: range / speed, pierce: pierce || 0, ignore: [] }, extra || {}));
}
function startReload() {
  const p = G.player;
  if (wtype() !== 'ranged' || p.reloadT > 0 || p.mag >= S.magSize) return;
  p.reloadT = W().reloadTime * S.reloadMul;
}
function alertNear(radius) {
  const p = G.player;
  for (const e of G.enemies) {
    if (e.state === 'idle' && Math.hypot(e.x - p.x, e.y - p.y) < radius) alertEnemy(e);
  }
}
function playerAttack() {
  const p = G.player, w = W();
  if (w.type === 'ranged') {
    const a = p.angle + (Math.random() + Math.random() - 1) * currentSpread() * deg;
    addBullet(p.x, p.y, a, w.speed, w.damage * S.dmgMul, 'player', w.range, S.pierce);
    p.mag--;
    p.cooldown = w.interval;
    p.bloom = Math.min(w.bloomMax, p.bloom + w.bloomPerShot);
    muzzle(a, '#ffe9a8');
    alertNear(420);
    if (p.mag <= 0) startReload();
  } else if (w.type === 'spell') {
    if (p.mana < w.cost) return;
    p.mana -= w.cost; p.manaDelay = w.regenDelay;
    const a = p.angle + (Math.random() + Math.random() - 1) * currentSpread() * deg;
    addBullet(p.x, p.y, a, w.speed, w.damage * S.dmgMul, 'player', w.range, S.pierce, { spell: true, splash: w.splash * S.splashMul });
    p.cooldown = w.interval;
    p.bloom = Math.min(w.bloomMax, p.bloom + w.bloomPerShot);
    muzzle(a, '#c9c0ff');
    alertNear(380);
  } else {
    meleeSwing();
  }
}
function muzzle(a, color) {
  const p = G.player;
  for (let i = 0; i < 3; i++) G.parts.push({ x: p.x + Math.cos(p.angle) * 20, y: p.y + Math.sin(p.angle) * 20, vx: Math.cos(a) * rand(60, 200) + rand(-40, 40), vy: Math.sin(a) * rand(60, 200) + rand(-40, 40), life: 0.1, color });
}
function meleeSwing() {
  const p = G.player, w = W();
  p.cooldown = w.interval; p.swingT = w.swing;
  const reach = w.reach * S.reachMul, arc = (w.arc + S.arcAdd) * deg;
  for (const e of G.enemies) {
    if (e.hp <= 0) continue;
    const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
    if (d > reach + e.r) continue;
    if (Math.abs(normAngle(Math.atan2(dy, dx) - p.angle)) > arc / 2 + Math.atan2(e.r, Math.max(d, 1))) continue;
    if (!hasLOS(p.x, p.y, e.x, e.y)) continue;
    damageEnemy(e, w.damage * S.dmgMul);
    if (S.chain > 0) chainLightning(e, w.damage * S.dmgMul * 0.5);
    // Rückstoß
    if (d > 0) moveCircle(e, dx / d * 16, dy / d * 16);
    spark(e.x, e.y, '#e8e8e8');
  }
  // Geschosse im Schwungbogen abwehren
  for (const b of G.bullets) {
    if (b.from !== 'enemy') continue;
    const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
    if (d < reach + 16 && Math.abs(normAngle(Math.atan2(dy, dx) - p.angle)) < arc / 2) { b.life = 0; spark(b.x, b.y, '#fff3c8'); }
  }
  alertNear(170);
}
function alertEnemy(e) {
  e.state = 'alert'; e.reaction = 0.6; e.lastX = G.player.x; e.lastY = G.player.y; e.lostT = 0;
}
function tryDash() {
  const p = G.player;
  if (!S.dash || p.dashCd > 0 || p.dashT > 0) return;
  let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), my = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  if (!mx && !my) { mx = Math.cos(p.angle); my = Math.sin(p.angle); }
  const l = Math.hypot(mx, my);
  p.dashX = mx / l; p.dashY = my / l;
  p.dashT = DASH.time; p.dashCd = DASH.cooldown;
  for (let i = 0; i < 10; i++) G.parts.push({ x: p.x, y: p.y, vx: rand(-60, 60) - p.dashX * 100, vy: rand(-60, 60) - p.dashY * 100, life: 0.35, color: '#9af0c0' });
}

// ---------- Update ----------
function update(dt) {
  if (state !== 'play') return;
  const p = G.player, w = W();
  G.time += dt;

  // Bewegung (WASD) oder Windstoß
  let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  let my = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  let moved;
  if (p.dashT > 0) {
    p.dashT -= dt;
    const v = DASH.dist / DASH.time;
    moved = moveCircle(p, p.dashX * v * dt, p.dashY * v * dt);
  } else {
    const len = Math.hypot(mx, my) || 1;
    let sp = S.moveSpeed * (p.reloadT > 0 ? 0.9 : 1);
    if (isBlocking()) sp *= 0.55; else if (isFocusing()) sp *= 0.65; else if (isMeditating()) sp *= 0.5;
    moved = moveCircle(p, mx / len * sp * dt, my / len * sp * dt);
  }
  p.speed = Math.min(moved / dt, S.moveSpeed * 1.3);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.swingT = Math.max(0, p.swingT - dt);
  p.y = clamp(p.y, G.camTop + p.r, G.camTop + VIEW_H - p.r);   // nicht aus dem Bild zurück

  p.angle = Math.atan2(mouse.y + G.camTop - p.y, mouse.x - p.x);

  // Waffe
  p.cooldown = Math.max(0, p.cooldown - dt);
  p.bloom = Math.max(0, p.bloom - (w.bloomRecover || 0) * dt);
  if (w.type === 'spell') {
    p.manaDelay = Math.max(0, p.manaDelay - dt);
    if (p.manaDelay <= 0) p.mana = Math.min(S.manaMax, p.mana + w.regen * S.manaRegenMul * (isMeditating() ? 3 : 1) * dt);
    else p.mana = Math.min(S.manaMax, p.mana);
  }
  if (p.reloadT > 0) {
    p.reloadT -= dt;
    if (p.reloadT <= 0) { p.reloadT = 0; p.mag = S.magSize; }
  } else if (mouse.down && p.cooldown <= 0 && !isBlocking() && !isMeditating()) {
    if (w.type !== 'ranged' || p.mag > 0) playerAttack();
  }

  // Kamera: nur nach oben, ab oberem Drittel
  if (p.y < G.camTop + VIEW_H / 3) G.camTop = p.y - VIEW_H / 3;
  G.dist = Math.max(G.dist, -p.y / PX_PER_M);
  generate();

  updateEnemies(dt);
  spawnReinforcements();
  updateBullets(dt);

  for (const k of G.pickups) {
    if (!k.taken && Math.hypot(k.x - p.x, k.y - p.y) < p.r + 12) {
      k.taken = true; p.hp = Math.min(S.maxHp, p.hp + k.heal);
      say('+' + k.heal + ' Leben');
    }
  }

  for (const q of G.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  for (const a of G.arcs) a.life -= dt;
  for (const r of G.rings) r.life -= dt;
  G.hurtT = Math.max(0, G.hurtT - dt);
  G.msgT = Math.max(0, G.msgT - dt);

  const bottom = G.camTop + VIEW_H + 250;
  G.obstacles = G.obstacles.filter(o => o.y < bottom);
  G.enemies = G.enemies.filter(e => e.hp > 0 && e.y < bottom);
  G.pickups = G.pickups.filter(k => !k.taken && k.y < bottom);
  G.parts = G.parts.filter(q => q.life > 0);
  G.arcs = G.arcs.filter(a => a.life > 0);
  G.rings = G.rings.filter(r => r.life > 0);

  if (p.hp <= 0) { die(); return; }
  if (G.dist >= G.nextPick) openPick();
}

function say(t) { G.msg = t; G.msgT = 2.2; }

// ---------- Kartenwahl ----------
function rollOffers() {
  const n = 3 + S.extraChoices, t = wtype();
  const count = id => G.cards.filter(c => c === id).length;
  const pool = CARDS.filter(c => count(c.id) < c.max && (!c.types || c.types.includes(t)));
  const out = [];
  while (out.length < n && pool.length) {
    const total = pool.reduce((s, c) => s + RARITY[c.rarity].weight, 0);
    let r = Math.random() * total, idx = 0;
    for (; idx < pool.length; idx++) { r -= RARITY[pool[idx].rarity].weight; if (r <= 0) break; }
    out.push(pool.splice(Math.min(idx, pool.length - 1), 1)[0]);
  }
  return out;
}
function openPick() {
  G.offers = rollOffers();
  if (!G.offers.length) { advanceStage(); return; }
  pickHover = -1;
  mouse.down = false; mouse.rdown = false;
  state = 'pick';
}
function advanceStage() {
  G.stageStart = G.nextPick;
  G.stage++;
  G.nextPick += stageLength(G.stage);
}
function choosePick(i) {
  const card = G.offers[i];
  if (!card) return;
  const p = G.player, oldMag = S.magSize, oldHp = S.maxHp;
  G.cards.push(card.id);
  recomputeStats();
  if (S.magSize > oldMag) p.mag += S.magSize - oldMag;
  if (S.maxHp > oldHp) p.hp += S.maxHp - oldHp;
  advanceStage();
  say(card.name + ': ' + card.stat);
  mouse.down = false; mouse.rdown = false;
  state = 'play';
}
function pickLayout() {
  const n = G.offers.length;
  const k = n >= 4 ? 1.0 : 1.18;
  const w = 220 * k, h = 320 * k, gap = n >= 4 ? 34 : 54;
  const total = n * w + (n - 1) * gap;
  const x0 = (FRAME_W - total) / 2, y = 168;
  return G.offers.map((c, i) => ({ c, x: x0 + i * (w + gap), y, w, h, k }));
}

// ---------- Charakterwahl ----------
const SEL = { w: 300, h: 470, gap: 40, y: 150 };
function selectLayout() {
  const total = CLASSES.length * SEL.w + (CLASSES.length - 1) * SEL.gap;
  const x0 = (FRAME_W - total) / 2;
  return CLASSES.map((c, i) => ({ c, i, x: x0 + i * (SEL.w + SEL.gap), y: SEL.y, w: SEL.w, h: SEL.h }));
}
function startRun(i) {
  lastClass = i;
  try { localStorage.setItem('left-behind-class', CLASSES[i].id); } catch (e) {}
  newGame(CLASSES[i]);
  mouse.down = false; mouse.rdown = false;
  state = 'play';
}

function updateEnemies(dt) {
  const p = G.player;
  for (const e of G.enemies) {
    const T = ENEMY_TYPES[e.type];
    e.hit = Math.max(0, e.hit - dt);
    const dx = p.x - e.x, dy = p.y - e.y, dist = Math.hypot(dx, dy);
    const los = hasLOS(e.x, e.y, p.x, p.y);

    if (e.state === 'idle') {
      if (los && dist < 440) { e.reaction -= dt; if (e.reaction <= 0) alertEnemy(e); }
      else e.reaction = Math.min(0.7, e.reaction + dt);
      continue;
    }

    if (los && dist < 640) { e.lastX = p.x; e.lastY = p.y; e.lostT = 0; }
    else { e.lostT += dt; }
    e.angle = Math.atan2(dy, dx);

    let dirx = 0, diry = 0, speed = T.speed;
    const tx = e.lastX - e.x, ty = e.lastY - e.y, td = Math.hypot(tx, ty) || 1;

    if (e.type === 'grunt') {
      if (los && dist < 640) {
        e.reaction -= dt;
        e.strafeT -= dt;
        if (e.strafeT <= 0) { e.strafe *= -1; e.strafeT = rand(1.2, 2.8); }
        if (dist > 380) { dirx = dx / dist; diry = dy / dist; speed = T.chase; }
        else if (dist < 230) { dirx = -dx / dist; diry = -dy / dist; }
        else { dirx = -dy / dist * e.strafe; diry = dx / dist * e.strafe; speed = T.speed * 0.8; }
        e.cooldown -= dt;
        if (e.reaction <= 0 && e.cooldown <= 0) {
          const a = e.angle + (Math.random() + Math.random() - 1) * 6 * deg;
          addBullet(e.x, e.y, a, 430, 8, 'enemy', 760, 0);
          e.burst++;
          if (e.burst >= 3) { e.burst = 0; e.cooldown = rand(1.3, 2.2); } else e.cooldown = 0.17;
        }
      } else if (td > 24) { dirx = tx / td; diry = ty / td; speed = T.chase; }
    } else {
      if (td > 6) { dirx = tx / td; diry = ty / td; speed = T.chase; }
      e.melee = Math.max(0, e.melee - dt);
      if (dist < e.r + p.r + 4 && e.melee <= 0) { hurtPlayer(12, Math.atan2(e.y - p.y, e.x - p.x)); e.melee = 0.7; }
    }

    if (e.steerT > 0) {
      e.steerT -= dt;
      const sx = dirx, sy = diry;
      dirx = -sy * e.steerDir; diry = sx * e.steerDir;
    }
    if (dirx || diry) {
      const moved = moveCircle(e, dirx * speed * dt, diry * speed * dt);
      if (moved < speed * dt * 0.3) {
        e.stuckT += dt;
        if (e.stuckT > 0.3) { e.steerT = 0.8; e.steerDir = Math.random() < 0.5 ? 1 : -1; e.stuckT = 0; }
      } else e.stuckT = 0;
    }
    for (const o of G.enemies) {
      if (o === e) continue;
      const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy);
      if (od > 0 && od < e.r + o.r) moveCircle(e, ox / od * 40 * dt, oy / od * 40 * dt);
    }
    if (e.lostT > 6 && e.type === 'grunt') { e.state = 'idle'; e.reaction = 0.7; }
  }
}

// Unregelmäßig: Wellen und einzelne Nachzügler von oben
function spawnEnemy(type) {
  const y = G.camTop - rand(30, 120);
  for (let t = 0; t < 20; t++) {
    const x = rand(70, WORLD_W - 70);
    if (G.obstacles.some(o => x > o.x - 30 && x < o.x + o.w + 30 && y > o.y - 30 && y < o.y + o.h + 30)) continue;
    G.enemies.push(makeEnemy(type, x, y, true));
    return true;
  }
  return false;
}
function spawnReinforcements() {
  if (G.time >= G.nextWave) {
    const n = Math.min(2 + Math.floor(G.dist / 120), 5);
    for (let i = 0; i < n; i++) spawnEnemy(Math.random() < 0.35 ? 'rusher' : 'grunt');
    say('Eine Horde bricht aus dem Wald!');
    G.nextWave = G.time + rand(22, 40);
  }
  if (G.time >= G.nextSingle) {
    if (Math.random() < 0.6) spawnEnemy(Math.random() < 0.4 ? 'rusher' : 'grunt');
    G.nextSingle = G.time + rand(9, 18);
  }
}

// srcAngle: Richtung vom Spieler zur Quelle; wird mit dem Schild abgefangen
function hurtPlayer(d, srcAngle) {
  const p = G.player;
  if (isBlocking() && srcAngle !== undefined && Math.abs(normAngle(srcAngle - p.angle)) < 80 * deg) {
    d *= (1 - S.block);
    spark(p.x + Math.cos(p.angle) * 18, p.y + Math.sin(p.angle) * 18, '#fff3c8');
    if (d < 1) return;
  }
  p.hp -= d;
  G.hurtT = 0.35;
}

function updateBullets(dt) {
  const p = G.player;
  for (const b of G.bullets) {
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    let tObs = Infinity;
    for (const o of G.obstacles) {
      if (Math.min(b.py, b.y) > o.y + o.h || Math.max(b.py, b.y) < o.y) continue;
      tObs = Math.min(tObs, segRect(b.px, b.py, b.x, b.y, o));
    }
    let tHit = Infinity, target = null;
    if (b.from === 'player') {
      for (const e of G.enemies) {
        if (e.hp <= 0 || b.ignore.includes(e)) continue;
        const t = segCircle(b.px, b.py, b.x, b.y, e.x, e.y, e.r);
        if (t < tHit) { tHit = t; target = e; }
      }
    } else {
      const t = segCircle(b.px, b.py, b.x, b.y, p.x, p.y, p.r);
      if (t < tHit) { tHit = t; target = p; }
    }
    if (tObs === Infinity && tHit === Infinity) continue;
    if (tHit < tObs) {
      const hx = b.px + (b.x - b.px) * tHit, hy = b.py + (b.y - b.py) * tHit;
      if (target === p) { hurtPlayer(b.dmg, Math.atan2(-b.vy, -b.vx)); spark(hx, hy, '#d33'); }
      else if (b.spell) {
        explode(hx, hy, b.dmg, b.splash, target);
        if (b.pierce > 0) { b.pierce--; b.ignore.push(target); continue; }
      } else {
        damageEnemy(target, b.dmg);
        if (S.chain > 0) chainLightning(target, b.dmg * 0.5);
        spark(hx, hy, '#e8e8e8');
        if (b.pierce > 0) { b.pierce--; b.ignore.push(target); continue; }
      }
    } else {
      const hx = b.px + (b.x - b.px) * tObs, hy = b.py + (b.y - b.py) * tObs;
      if (b.spell) explode(hx, hy, b.dmg, b.splash, null); else spark(hx, hy, '#bbb');
    }
    b.life = 0;
  }
  G.bullets = G.bullets.filter(b => b.life > 0);
}
function explode(x, y, dmg, R, target) {
  G.rings.push({ x, y, r: R, life: 0.28, max: 0.28 });
  for (let i = 0; i < 10; i++) G.parts.push({ x, y, vx: rand(-140, 140), vy: rand(-140, 140), life: 0.3, color: '#c9c0ff' });
  for (const e of G.enemies) {
    if (e.hp <= 0) continue;
    if (Math.hypot(e.x - x, e.y - y) <= R + e.r) {
      damageEnemy(e, dmg * (e === target ? 1 : 0.7));
      if (e === target && S.chain > 0) chainLightning(e, dmg * 0.5);
    }
  }
}
function damageEnemy(e, dmg) {
  if (e.hp <= 0) return;
  e.hp -= dmg; e.hit = 0.12;
  if (e.state === 'idle') alertEnemy(e);
  if (e.hp <= 0) G.kills++;
}
function chainLightning(from, dmg) {

    .slice(0, S.chain);
  for (const o of near) {

// ---------- Sicht ----------
function visionParams() {
  return { fov: S.fov * deg, range: VISION.range * S.rangeMul, near: VISION.near };
}
function obstacleSegments() {
  const segs = [], top = G.camTop - 800, bot = G.camTop + VIEW_H + 800;
  for (const o of G.obstacles) {
    if (o.y > bot || o.y + o.h < top) continue;
    segs.push([o.x, o.y, o.x + o.w, o.y], [o.x + o.w, o.y, o.x + o.w, o.y + o.h],
              [o.x + o.w, o.y + o.h, o.x, o.y + o.h], [o.x, o.y + o.h, o.x, o.y]);
  }
  segs.push([0, top - 2000, 0, bot + 2000], [WORLD_W, top - 2000, WORLD_W, bot + 2000]);
  return segs;
}
function visPoly(cx, cy, center, half, range, segs, step) {
  const full = half >= Math.PI - 1e-6;
  const rels = [];
  const n = Math.max(8, Math.ceil(2 * half / step));
  for (let i = 0; i <= n; i++) rels.push(-half + i * (2 * half / n));
  for (const o of G.obstacles) {
    if (o.x > cx + range || o.x + o.w < cx - range || o.y > cy + range || o.y + o.h < cy - range) continue;
    for (const [px, py] of [[o.x, o.y], [o.x + o.w, o.y], [o.x + o.w, o.y + o.h], [o.x, o.y + o.h]]) {
      const rel = normAngle(Math.atan2(py - cy, px - cx) - center);
      if (Math.abs(rel) <= half) rels.push(rel - 0.0003, rel, rel + 0.0003);
    }
  }
  rels.sort((a, b) => a - b);
  const pts = [];
  if (!full) pts.push([cx, cy]);
  for (const rel of rels) {
    if (rel < -half || rel > half) continue;
    const a = center + rel, dx = Math.cos(a), dy = Math.sin(a);
    const d = rayDist(cx, cy, dx, dy, range, segs);
    pts.push([cx + dx * d, cy + dy * d]);
  }
  return pts;
}
function visible(e) {
  const p = G.player, V = visionParams();
  const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
  if (d > V.range + e.r) return false;
  const inNear = d < V.near + e.r;
  const rel = normAngle(Math.atan2(dy, dx) - p.angle);
  const inCone = Math.abs(rel) < V.fov / 2 + Math.atan2(e.r, Math.max(d, 1));
  if (!inNear && !inCone) return false;
  return hasLOS(p.x, p.y, e.x, e.y);
}
function pointVisible(x, y) { return visible({ x, y, r: 0 }); }

function wrap(str, maxW, font) {

    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }

}

// Floor-Pattern (einmal erzeugt)
let floorPattern = null;
function makeFloor() {
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const x = c.getContext('2d');
  x.fillStyle = '#1d3524'; x.fillRect(0, 0, 160, 160);
  for (let i = 0; i < 260; i++) {
    x.fillStyle = Math.random() < 0.5 ? 'rgba(150,215,140,.10)' : 'rgba(0,0,0,.12)';
    const px = Math.random() * 160, py = Math.random() * 160;
    x.fillRect(px, py, 1.5, Math.random() * 5 + 2);
  }

}

// ---------- Zeichnen: Welt ----------
function drawWorld() {
  const top = G.camTop;
  if (!floorPattern) makeFloor();
  ctx.fillStyle = floorPattern;
  ctx.fillRect(0, top, VIEW_W, VIEW_H);
  // Steinpfad in der Mitte
  const g = ctx.createLinearGradient(300, 0, 660, 0);
  g.addColorStop(0, 'rgba(150,150,130,0)'); g.addColorStop(0.15, 'rgba(150,150,130,.22)'); g.addColorStop(0.85, 'rgba(150,150,130,.22)'); g.addColorStop(1, 'rgba(150,150,130,0)');
  ctx.fillStyle = g; ctx.fillRect(300, top, 360, VIEW_H);
  ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let y = Math.floor(top / 52) * 52; y <= top + VIEW_H; y += 52) { ctx.moveTo(320, y); ctx.lineTo(640, y); }
  ctx.stroke();
  // Startlichtung
  const sg = ctx.createRadialGradient(480, -30, 20, 480, -30, 240);
  sg.addColorStop(0, 'rgba(255,214,120,.28)'); sg.addColorStop(1, 'rgba(255,214,120,0)');
  ctx.fillStyle = sg; ctx.fillRect(200, -280, 560, 560);
  ctx.fillStyle = '#ff9a3c'; ctx.beginPath(); ctx.arc(480, 24, 7, 0, 7); ctx.fill();
  // Waldrand
  for (const side of [0, 1]) {
    const gx = side ? VIEW_W : 0, ge = side ? VIEW_W - 26 : 26;
    const eg = ctx.createLinearGradient(gx, 0, ge, 0);
    eg.addColorStop(0, '#040806'); eg.addColorStop(1, 'rgba(4,8,6,0)');
    ctx.fillStyle = eg; ctx.fillRect(Math.min(gx, ge), top, 26, VIEW_H);
  }

  for (const o of G.obstacles) {
    if (o.y > top + VIEW_H || o.y + o.h < top) continue;

  }
  // Heiltränke
  for (const k of G.pickups) {
    ctx.fillStyle = 'rgba(255,120,150,.25)'; ctx.beginPath(); ctx.arc(k.x, k.y, 20, 0, 7); ctx.fill();
    rr(k.x - 8, k.y - 11, 16, 22, 6); ctx.fillStyle = '#d33a5a'; ctx.fill();

}
function drawObstacle(o) {

function drawEntities() {
  const p = G.player;
  for (const e of G.enemies) {

    ctx.fillStyle = 'rgba(168,156,255,' + (0.25 * (1 - f)) + ')';
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.4 + 0.6 * f), 0, 7); ctx.fill();
  }

}
function drawSkeleton(e) {

  ctx.fillStyle = '#8ee8ff';

function drawGhoul(e) {

// Spielfigur von oben; id bestimmt die Klasse, Blickrichtung = angle

function drawFogInto() {
  const p = G.player, V = visionParams(), segs = obstacleSegments();
  const cone = visPoly(p.x, p.y, p.angle, V.fov / 2, V.range, segs, 0.006);
  const ring = visPoly(p.x, p.y, 0, Math.PI, V.near, segs, 0.05);
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0, 0, fog.width, fog.height);
  fctx.fillStyle = 'rgba(3,8,10,0.70)';
  fctx.fillRect(FIELD_X * scale, 0, VIEW_W * scale, VIEW_H * scale);
  fctx.globalCompositeOperation = 'destination-out';
  fctx.setTransform(scale, 0, 0, scale, FIELD_X * scale, -G.camTop * scale);
  fctx.fillStyle = '#000';
  for (const poly of [cone, ring]) {
    fctx.beginPath();
    poly.forEach((pt, i) => i ? fctx.lineTo(pt[0], pt[1]) : fctx.moveTo(pt[0], pt[1]));

// ---------- Zeichnen: Karten ----------
function drawCard(c, x, y, k, hover) {
  const R = RARITY[c.rarity];
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.shadowColor = hover ? R.c : 'rgba(0,0,0,.65)';
  ctx.shadowBlur = hover ? 34 : 18; ctx.shadowOffsetY = hover ? 0 : 8;
  const fg = ctx.createLinearGradient(0, 0, 220, 320);
  fg.addColorStop(0, R.c); fg.addColorStop(0.5, R.c2); fg.addColorStop(1, R.c);
  rr(0, 0, 220, 320, 12); ctx.fillStyle = fg; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  const pg = ctx.createLinearGradient(0, 0, 0, 320);
  pg.addColorStop(0, '#ece1c2'); pg.addColorStop(1, '#d8c89b');
  rr(6, 6, 208, 308, 7); ctx.fillStyle = pg; ctx.fill();
  ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 2; ctx.stroke();
  text(c.name, 110, 30, c.name.length > 20 ? 12.5 : 15, '#2a1f14', 'center', F_TITLE);
  ctx.strokeStyle = 'rgba(58,42,24,.45)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(18, 40); ctx.lineTo(202, 40); ctx.stroke();
  const ag = ctx.createRadialGradient(110, 130, 4, 110, 130, 100);
  ag.addColorStop(0, R.c + '66'); ag.addColorStop(0.75, '#0c1210'); ag.addColorStop(1, '#0c1210');
  rr(15, 48, 190, 120, [60, 60, 6, 6]); ctx.fillStyle = ag; ctx.fill();
  ctx.strokeStyle = R.c; ctx.lineWidth = 3; ctx.stroke();
  drawIcon(c.icon, 110, 108, 72, R.c, 1.2);
  rr(40, 156, 140, 20, 3); ctx.fillStyle = R.c; ctx.fill(); ctx.strokeStyle = '#2a1f14'; ctx.lineWidth = 1; ctx.stroke();
  text(c.kind.toUpperCase(), 110, 171, 12, '#1c140c', 'center', F_TEXT, 'bold');
  const sl = wrap(c.stat, 190, '14px ' + F_TITLE);
  sl.slice(0, 2).forEach((l, i) => text(l, 110, 198 + i * 15, 14, R.ink, 'center', F_TITLE));
  const off = sl.length > 1 ? 15 : 0;
  const lines = wrap(c.text, 186, '500 15px ' + F_TEXT);
  lines.slice(0, 4).forEach((l, i) => text(l, 110, 220 + off + i * 16, 15, '#2a1f14', 'center', F_TEXT, '500'));
  const fl = wrap(c.flavor, 186, 'italic 13px ' + F_TEXT);
  fl.slice(0, 2).forEach((l, i) => text(l, 110, 282 - (Math.min(fl.length, 2) - 1) * 14 + i * 14, 13, '#5a4630', 'center', F_TEXT, 'italic'));
  ctx.strokeStyle = 'rgba(58,42,24,.45)'; ctx.beginPath(); ctx.moveTo(18, 292); ctx.lineTo(202, 292); ctx.stroke();
  ctx.fillStyle = R.c; ctx.beginPath(); ctx.arc(24, 304, 6, 0, 7); ctx.fill(); ctx.strokeStyle = '#2a1f14'; ctx.lineWidth = 2; ctx.stroke();
  text(R.label.toUpperCase(), 36, 308, 12, R.ink, 'left', F_TEXT, 'bold');
  ctx.restore();
}

// ---------- Zeichnen: Oberfläche ----------
function drawRails() {
  const p = G.player, w = W();
  // Linke Leiste: Fortschritt im Level
  let g = ctx.createLinearGradient(0, 0, 120, 0); g.addColorStop(0, '#0a110d'); g.addColorStop(1, '#14201a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 120, FRAME_H);
  ctx.fillStyle = '#9a7a3a'; ctx.fillRect(117, 0, 3, FRAME_H);
  text('STUFE', 60, 30, 12, '#b8c4d0', 'center', F_TITLE);
  text(String(G.stage), 60, 68, 32, '#f0e6c8', 'center', F_TITLE);
  const len = G.nextPick - G.stageStart;
  const prog = clamp((G.dist - G.stageStart) / len, 0, 1);
  rr(49, 96, 22, 480, 11); ctx.fillStyle = '#050a07'; ctx.fill(); ctx.strokeStyle = '#9a7a3a'; ctx.lineWidth = 2; ctx.stroke();
  if (prog > 0) {
    const fh = Math.max(14, (480 - 8) * prog);
    const bg = ctx.createLinearGradient(51, 0, 69, 0); bg.addColorStop(0, '#8ee8ff'); bg.addColorStop(1, '#3ea6c4');
    rr(53, 572 - fh, 14, fh, 7); ctx.fillStyle = bg; ctx.fill();
  }
  for (let i = 0; i <= 4; i++) {
    const m = Math.round(G.stageStart + len * i / 4), y = 576 - i * 120;
    text('— ' + m, 78, y + 5, 14, i === 4 ? '#8ee8ff' : '#b8c4d0', 'left', F_TEXT, i === 4 ? 'bold' : '');
  }
  const my = 576 - prog * 480;
  rr(4, my - 10, 42, 20, 10); ctx.fillStyle = '#050a07'; ctx.fill(); ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 1; ctx.stroke();
  text(String(Math.floor(G.dist)), 25, my + 4, 12, '#f0e6c8', 'center', F_TITLE);
  text('NÄCHSTE KARTE', 60, 606, 10, '#b8c4d0', 'center', F_TITLE);
  text('bei ' + Math.ceil(G.nextPick) + ' m', 60, 630, 17, '#8ee8ff', 'center', F_TITLE);
  text('Rekord ' + Math.floor(best) + ' m', 60, 664, 15, '#b8c4d0', 'center', F_TEXT);

  // Untere Leiste
  g = ctx.createLinearGradient(0, 640, 0, 720); g.addColorStop(0, '#14201a'); g.addColorStop(1, '#0a110d');
  ctx.fillStyle = g; ctx.fillRect(FIELD_X, 640, VIEW_W, 80);
  ctx.fillStyle = '#9a7a3a'; ctx.fillRect(FIELD_X, 640, VIEW_W, 3);
  text('LEBENSKRAFT', FIELD_X + 28, 668, 12, '#b8c4d0', 'left', F_TITLE);
  text(Math.ceil(Math.max(0, p.hp)) + ' / ' + S.maxHp, FIELD_X + 308, 668, 14, '#f0e6c8', 'right', F_TITLE);
  rr(FIELD_X + 28, 676, 280, 16, 8); ctx.fillStyle = '#050a07'; ctx.fill(); ctx.strokeStyle = '#9a7a3a'; ctx.lineWidth = 2; ctx.stroke();
  const hg = ctx.createLinearGradient(0, 680, 0, 690); hg.addColorStop(0, '#e0606a'); hg.addColorStop(1, '#a8323c');
  rr(FIELD_X + 32, 680, Math.max(0, 272 * p.hp / S.maxHp), 8, 4); ctx.fillStyle = hg; ctx.fill();
  // Fähigkeit
  const ax = FIELD_X + 340;
  rr(ax, 653, 240, 54, 27); ctx.fillStyle = '#0a110d'; ctx.fill();
  ctx.strokeStyle = S.dash ? '#4fd08a' : '#2e3e32'; ctx.lineWidth = 2; ctx.stroke();
  if (S.dash) {
    rr(ax + 14, 669, 72, 22, 5); ctx.fillStyle = '#e8dcbc'; ctx.fill();
    text('Leertaste', ax + 50, 685, 14, '#1c140c', 'center', F_TEXT, 'bold');
    text('Windstoß', ax + 96, 685, 14, '#f0e6c8', 'left', F_TITLE);
    const cd = 1 - p.dashCd / DASH.cooldown;
    rr(ax + 172, 676, 54, 8, 4); ctx.fillStyle = '#1e2c22'; ctx.fill();
    rr(ax + 172, 676, 54 * cd, 8, 4); ctx.fillStyle = cd >= 1 ? '#4fd08a' : '#2e8a5a'; ctx.fill();
  } else {
    text('Keine Fähigkeit', ax + 120, 686, 15, '#6f8274', 'center', F_TEXT, 'italic');
  }
  // Waffe / Ressource
  const rx = FIELD_X + VIEW_W - 26;
  text((G.cls.name + ' · ' + w.name).toUpperCase(), rx, 664, 12, '#b8c4d0', 'right', F_TITLE);
  if (w.type === 'ranged') {
    text(p.reloadT > 0 ? 'spannen …' : 'R spannen · ' + (w.reloadTime * S.reloadMul).toFixed(1) + ' s', rx - 100, 690, 14, '#b8c4d0', 'right', F_TEXT);
    ctx.font = '42px ' + F_TITLE; ctx.textAlign = 'right';
    ctx.fillStyle = p.mag === 0 ? '#ff7a8a' : silverGrad(672, 706);
    ctx.fillText(String(p.mag), rx - 62, 704);
    text('/ ' + S.magSize, rx, 704, 19, '#b8c4d0', 'right', F_TITLE);
  } else if (w.type === 'spell') {
    const mp = p.mana / S.manaMax;
    text(isMeditating() ? 'Meditation …' : 'Rechtsklick: Meditieren', rx - 120, 700, 14, '#b8c4d0', 'right', F_TEXT);
    text('MANA ' + Math.floor(p.mana) + ' / ' + S.manaMax, rx, 686, 14, '#e8e2ff', 'right', F_TITLE);
    rr(rx - 110, 692, 110, 12, 6); ctx.fillStyle = '#050a07'; ctx.fill(); ctx.strokeStyle = '#6a5ac0'; ctx.lineWidth = 2; ctx.stroke();
    rr(rx - 107, 695, 104 * mp, 6, 3); ctx.fillStyle = p.mana < w.cost ? '#7a6aa0' : '#a89cff'; ctx.fill();
  } else {
    const cdp = 1 - p.cooldown / w.interval;
    text(isBlocking() ? 'Schild oben' : 'Rechtsklick: Schild', rx - 120, 700, 14, '#b8c4d0', 'right', F_TEXT);
    text('BLOCK ' + Math.round(S.block * 100) + ' %', rx, 686, 14, '#e8eef4', 'right', F_TITLE);
    rr(rx - 110, 692, 110, 12, 6); ctx.fillStyle = '#050a07'; ctx.fill(); ctx.strokeStyle = '#8a929a'; ctx.lineWidth = 2; ctx.stroke();
    rr(rx - 107, 695, 104 * clamp(cdp, 0, 1), 6, 3); ctx.fillStyle = cdp >= 1 ? '#d2dae2' : '#6a747e'; ctx.fill();
  }

  // Rechte Leiste: aktive Karten
  g = ctx.createLinearGradient(1080, 0, 1280, 0); g.addColorStop(0, '#14201a'); g.addColorStop(1, '#0a110d');
  ctx.fillStyle = g; ctx.fillRect(1080, 0, 200, FRAME_H);
  ctx.fillStyle = '#9a7a3a'; ctx.fillRect(1080, 0, 3, FRAME_H);
  text('AKTIVE KARTEN', 1094, 34, 12, '#b8c4d0', 'left', F_TITLE);
  text(String(G.cards.length), 1270, 34, 13, '#f0e6c8', 'right', F_TITLE);
  const groups = [];
  for (const id of G.cards) { const gr = groups.find(x => x.id === id); if (gr) gr.n++; else groups.push({ id, n: 1 }); }
  const chipH = 56, chipGap = 7, maxChips = 9;
  groups.slice(0, maxChips).forEach((gr, i) => {
    const c = CARD_BY_ID[gr.id], R = RARITY[c.rarity], y = 50 + i * (chipH + chipGap);
    rr(1092, y, 176, chipH, 6); ctx.fillStyle = '#16231b'; ctx.fill(); ctx.strokeStyle = R.c; ctx.lineWidth = 2; ctx.stroke();
    rr(1100, y + 8, 40, 40, [20, 20, 4, 4]); ctx.fillStyle = '#0a110d'; ctx.fill(); ctx.strokeStyle = R.c; ctx.lineWidth = 1; ctx.stroke();
    drawIcon(c.icon, 1120, y + 28, 26, R.c, 1.4);
    const nl = wrap(c.name, 112, '12px ' + F_TITLE);
    nl.slice(0, 2).forEach((l, j) => text(l, 1148, y + 20 + j * 13, 12, '#f0e6c8', 'left', F_TITLE));
    const sl = wrap(c.stat, 116, '13px ' + F_TEXT);
    text(sl[0], 1148, y + 20 + Math.min(nl.length, 2) * 13 + 2, 13, '#f2c14e', 'left', F_TEXT);
    if (gr.n > 1) {
      rr(1244, y - 6, 28, 18, 9); ctx.fillStyle = '#f2c14e'; ctx.fill();
      text('×' + gr.n, 1258, y + 7, 12, '#1c140c', 'center', F_TITLE);
    }
  });
  if (!groups.length) {
    text('Noch keine Karten.', 1180, 120, 15, '#7a8a7a', 'center', F_TEXT, 'italic');
    text('Bei ' + Math.ceil(G.nextPick) + ' m wählst du', 1180, 146, 15, '#b8c4d0', 'center', F_TEXT);
    text('deine erste Karte.', 1180, 166, 15, '#b8c4d0', 'center', F_TEXT);
  }
}

  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 6;

  ctx.shadowBlur = 0;
  text(G.kills + ' Gefallene', 24, 74, 17, '#c8d4de', 'left', F_TEXT);
  if (G.msgT > 0) {
    ctx.globalAlpha = Math.min(1, G.msgT * 2);
    text(G.msg, VIEW_W / 2, 56, 20, '#f2c14e', 'center', F_TITLE);

}

function drawCrosshair() {
  const p = G.player, w = W();
  const x = mouse.fx, y = mouse.fy;
  ctx.strokeStyle = '#fff3c8'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (w.type === 'melee') {
    ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.stroke();
    ctx.fillStyle = '#fff3c8'; ctx.fillRect(x - 1, y - 1, 2, 2);
    return;
  }
  const dist = Math.hypot(mouse.x - p.x, mouse.y + G.camTop - p.y);
  const gap = clamp(Math.tan(currentSpread() * deg) * dist, 5, 70);
  ctx.beginPath();
  ctx.moveTo(x - gap - 8, y); ctx.lineTo(x - gap, y);
  ctx.moveTo(x + gap, y); ctx.lineTo(x + gap + 8, y);
  ctx.moveTo(x, y - gap - 8); ctx.lineTo(x, y - gap);
  ctx.moveTo(x, y + gap); ctx.lineTo(x, y + gap + 8);
  ctx.stroke();
  ctx.fillStyle = '#fff3c8'; ctx.fillRect(x - 1, y - 1, 2, 2);
  if (p.reloadT > 0) {
    const f = 1 - p.reloadT / (w.reloadTime * S.reloadMul);
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, gap + 16, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); ctx.stroke();
  }
}

    ctx.strokeStyle = 'rgba(58,42,24,.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(24, 56); ctx.lineTo(L.w - 24, 56); ctx.stroke();
    // Bogenfenster mit Figur

    rr(22, 66, L.w - 44, 150, [76, 76, 8, 8]); ctx.fillStyle = ag; ctx.fill();
    ctx.strokeStyle = c.accent; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.beginPath(); rr(22, 66, L.w - 44, 150, [76, 76, 8, 8]); ctx.clip();
    drawFigure(c.id, L.w / 2 - 14, 162, -Math.PI / 2 + (hover ? 0.12 : 0), 2.3, { swing: -1 });
    ctx.restore();
    // Rolle
    rr(L.w / 2 - 70, 204, 140, 22, 4); ctx.fillStyle = c.accent; ctx.fill(); ctx.strokeStyle = '#2a1f14'; ctx.lineWidth = 1; ctx.stroke();
    text(c.role.toUpperCase(), L.w / 2, 220, 13, '#1c140c', 'center', F_TEXT, 'bold');

}

  for (const s of stars) { ctx.fillStyle = 'rgba(255,255,255,' + s[3] + ')'; ctx.fillRect(s[0], s[1], s[2], s[2]); }
  const mg = ctx.createRadialGradient(990, 165, 10, 990, 165, 240);
  mg.addColorStop(0, 'rgba(200,225,255,.5)'); mg.addColorStop(1, 'rgba(200,225,255,0)');
  ctx.fillStyle = mg; ctx.fillRect(740, -80, 500, 500);
  const mg2 = ctx.createRadialGradient(970, 145, 8, 995, 165, 95);
  mg2.addColorStop(0, '#fff'); mg2.addColorStop(0.6, '#dce8f2'); mg2.addColorStop(1, '#aab8c6');
  ctx.fillStyle = mg2; ctx.beginPath(); ctx.arc(995, 165, 95, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(120,140,160,.28)'; ctx.beginPath(); ctx.arc(947, 128, 17, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(1025, 195, 25, 0, 7); ctx.fill();
  ctx.fillStyle = '#0d1a14';
  ctx.beginPath(); ctx.moveTo(560, 720); ctx.bezierCurveTo(640, 470, 760, 440, 860, 450); ctx.bezierCurveTo(960, 460, 1060, 500, 1280, 520); ctx.lineTo(1280, 720); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#0a120d';
  ctx.fillRect(700, 360, 130, 112); ctx.fillRect(640, 400, 78, 80); ctx.fillRect(880, 320, 118, 150);
  for (let x = 700; x < 830; x += 22) ctx.fillRect(x, 336, 12, 24);
  for (let x = 880; x < 998; x += 24) ctx.fillRect(x, 292, 14, 28);
  ctx.beginPath(); ctx.moveTo(912, 320); ctx.lineTo(936, 250); ctx.lineTo(960, 320); ctx.fill();
  ctx.fillStyle = 'rgba(233,196,106,.85)'; ctx.fillRect(926, 350, 8, 16); ctx.fillRect(740, 400, 8, 14);
  for (const layer of [0, 1]) {
    ctx.fillStyle = layer ? '#07100b' : '#0a130e';
    for (const [x, y, h] of pines) {
      const px = x + (layer ? 17 : 0), py = y + (layer ? 60 : 0), ph = h * (layer ? 1.15 : 1);
      ctx.beginPath(); ctx.moveTo(px - ph * 0.28, py + 180); ctx.lineTo(px, py + 180 - ph * 1.5); ctx.lineTo(px + ph * 0.28, py + 180); ctx.fill();
    }
  }
  ctx.fillRect(0, 700, FRAME_W, 20);
  for (const [x, y, c] of [[470, 520, '#8ee8ff'], [560, 600, '#8ee8ff'], [1120, 560, '#e9c46a']]) {
    ctx.shadowColor = c; ctx.shadowBlur = 18; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  }
  g = ctx.createRadialGradient(640, 324, 300, 640, 324, 760);
  g.addColorStop(0, 'rgba(2,5,4,0)'); g.addColorStop(1, 'rgba(2,5,4,.65)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, FRAME_W, FRAME_H);
  text('Weiteste Reise: ', 40, 48, 17, '#b8c4d0', 'left', F_TEXT);
  text(Math.floor(best) + ' m', 40 + 118, 48, 19, '#f2c14e', 'left', F_TITLE);
  text('DIE LETZTEN DER FALLENEN KRONE', 80, 124, 19, '#8ee8ff', 'left', F_TEXT, '500');
  ctx.font = '100px ' + F_TITLE; ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 5;
  ctx.fillStyle = '#0a110d'; ctx.fillText('Left Behind', 80, 232);
  ctx.shadowOffsetY = 0; ctx.shadowColor = 'rgba(200,225,255,.35)'; ctx.shadowBlur = 30;
  ctx.fillStyle = silverGrad(150, 240); ctx.fillText('Left Behind', 80, 228);
  ctx.shadowBlur = 0;
  text('Das Königreich fiel in einer Nacht.', 80, 282, 22, '#c8d4de', 'left', F_TEXT, 'italic');
  text('Du bist, was von ihm übrig blieb.', 80, 312, 22, '#c8d4de', 'left', F_TEXT, 'italic');
  text('WASD bewegen · Maus zielen · Linksklick angreifen · Rechtsklick Spezial', 80, 372, 17, '#b8c4d0', 'left', F_TEXT);
  menuButtons.forEach((b, i) => {
    const hover = menuHover === i && b.action;
    notched(b.x, b.y, b.w, b.h, 12); ctx.fillStyle = b.main ? '#f2c14e' : (hover ? '#f2c14e' : '#9a7a3a'); ctx.fill();
    const ig = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    if (b.main) { ig.addColorStop(0, '#f6d37a'); ig.addColorStop(1, '#d9a636'); } else { ig.addColorStop(0, '#1e2c22'); ig.addColorStop(1, '#121b15'); }
    notched(b.x + 2, b.y + 2, b.w - 4, b.h - 4, 11); ctx.fillStyle = ig; ctx.fill();
    text(b.label, b.x + b.w / 2, b.y + 36, 19, b.main ? '#1c140c' : (b.action ? '#e8dcbc' : '#7a8a7a'), 'center', F_TITLE);
    if (b.note) text(b.note, b.x + b.w - 22, b.y + 34, 14, '#7a8a7a', 'right', F_TEXT, 'italic');
  });
  text('Prototyp v0.3 · Streiter wählen, Karten im Lauf', 80, 690, 16, '#b8c4d0', 'left', F_TEXT);
  text('Klick oder Enter zum Starten', 440, 456, 17, '#f2c14e', 'left', F_TEXT, 'italic');
}

function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#0a110d'; ctx.fillRect(0, 0, FRAME_W, FRAME_H);
  if (state === 'menu' || !G && state !== 'select') { drawMenu(); drawCursor(); return; }
  if (state === 'select') { drawSelectScreen(); drawCursor(); return; }

  ctx.save();
  ctx.beginPath(); ctx.rect(FIELD_X, 0, VIEW_W, VIEW_H); ctx.clip();
  ctx.translate(FIELD_X, -G.camTop);
  drawWorld();
  drawEntities();
  ctx.restore();
  drawFogInto();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(fog, 0, 0); ctx.restore();
  ctx.save(); ctx.translate(FIELD_X, 0);
  ctx.beginPath(); ctx.rect(0, 0, VIEW_W, VIEW_H); ctx.clip();
  drawFieldHUD();
  ctx.restore();
  drawRails();

  if (state === 'play') drawCrosshair();
  if (state === 'pause') { overlay(0.7); text('Pause', 640, 340, 48, '#f0e6c8', 'center', F_TITLE); text('Esc / P zum Fortsetzen', 640, 384, 19, '#b8c4d0', 'center', F_TEXT); }
  if (state === 'pick') { drawPickScreen(); drawCursor(); }
  if (state === 'dead') {
    overlay(0.78);
    text('Gefallen', 640, 290, 56, '#ff7a8a', 'center', F_TITLE);
    text(G.cls.name + ' · ' + Math.floor(G.dist) + ' m · ' + G.kills + ' Gefallene · ' + G.cards.length + ' Karten', 640, 346, 24, '#f0e6c8', 'center', F_TEXT);
    text('Rekord: ' + Math.floor(best) + ' m', 640, 384, 19, '#b8c4d0', 'center', F_TEXT);
    text('Klick oder Enter: neuen Streiter wählen', 640, 440, 20, '#f2c14e', 'center', F_TEXT, 'italic');
    drawCursor();
  }
}
function drawCursor() {
  ctx.fillStyle = '#fff3c8'; ctx.strokeStyle = '#0a110d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(mouse.fx, mouse.fy, 4, 0, 7); ctx.fill(); ctx.stroke();
}

// ---------- Eingabe ----------
function toSelect() { selectHover = lastClass; state = 'select'; }
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (state === 'menu' && (e.code === 'Enter' || e.code === 'Space')) { toSelect(); return; }
  if (state === 'dead' && (e.code === 'Enter' || e.code === 'Space')) { toSelect(); return; }
  if (state === 'select') {
    if (/^Digit[1-9]$/.test(e.code)) { const i = Number(e.code.slice(5)) - 1; if (CLASSES[i]) startRun(i); return; }
    if (e.code === 'Enter' || e.code === 'Space') { startRun(selectHover >= 0 ? selectHover : lastClass); return; }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') selectHover = (Math.max(selectHover, 0) + CLASSES.length - 1) % CLASSES.length;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') selectHover = (Math.max(selectHover, 0) + 1) % CLASSES.length;
    if (e.code === 'Escape') state = 'menu';
    return;
  }
  if (state === 'play') {
    if (e.code === 'KeyR') startReload();
    if (e.code === 'Space') tryDash();
  }
  if (state === 'pick' && /^Digit[1-4]$/.test(e.code)) choosePick(Number(e.code.slice(5)) - 1);
  if ((e.code === 'Escape' || e.code === 'KeyP') && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; mouse.rdown = false; if (state === 'play') state = 'pause'; });
function setMouse(e) {
  const r = canvas.getBoundingClientRect();
  mouse.fx = (e.clientX - r.left) / r.width * FRAME_W;
  mouse.fy = (e.clientY - r.top) / r.height * FRAME_H;
  mouse.x = mouse.fx - FIELD_X;
  mouse.y = mouse.fy;
  if (state === 'menu') menuHover = menuButtons.findIndex(b => mouse.fx >= b.x && mouse.fx <= b.x + b.w && mouse.fy >= b.y && mouse.fy <= b.y + b.h);
  if (state === 'pick') pickHover = pickLayout().findIndex(L => mouse.fx >= L.x && mouse.fx <= L.x + L.w && mouse.fy >= L.y && mouse.fy <= L.y + L.h);
  if (state === 'select') {
    const hit = selectLayout().find(L => mouse.fx >= L.x && mouse.fx <= L.x + L.w && mouse.fy >= L.y && mouse.fy <= L.y + L.h);
    selectHover = hit ? hit.i : (mouse.fx >= 40 && mouse.fx <= 160 && mouse.fy >= 36 && mouse.fy <= 76 ? -2 : selectHover === -2 ? -1 : selectHover);
    if (hit) selectHover = hit.i;
  }
}
canvas.addEventListener('mousemove', setMouse);
canvas.addEventListener('mousedown', e => {
  setMouse(e);
  if (state === 'play' || state === 'pause') {
    if (e.button === 2) mouse.rdown = true;
  }
  if (e.button !== 0) return;
  if (state === 'menu') { const b = menuButtons[menuHover]; if (b && b.action) b.action(); return; }
  if (state === 'select') {
    if (selectHover === -2) { state = 'menu'; return; }
    if (selectHover >= 0) startRun(selectHover);
    return;
  }
  if (state === 'dead') { toSelect(); return; }
  if (state === 'pause') { state = 'play'; return; }
  if (state === 'pick') { if (pickHover >= 0) choosePick(pickHover); return; }
  mouse.down = true;
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; if (e.button === 2) mouse.rdown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---------- Hauptschleife ----------
let last = 0;
function loop(t) {
  const dt = Math.min((t - (last || t)) / 1000, 0.05);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
