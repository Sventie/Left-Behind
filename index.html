<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Left Behind</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c0f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: none; background: #1a1c20; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// =====================================================================
//  Left Behind – Topdown-Prototyp
//  WASD bewegen, Maus zielen/schießen, R nachladen, Esc/P Pause
//  Alle Werte zum Ausprobieren stehen im Block "Balancing".
// =====================================================================

// ---------- Balancing ----------
// Sichtbarer Ausschnitt: fest, damit Fenstergröße keinen Vorteil bringt
const VIEW_W = 960, VIEW_H = 640;      // 3:2
const WORLD_W = VIEW_W;                 // links/rechts fix
const PX_PER_M = 40;
const CHUNK_H = VIEW_H;

const STATS = {                         // Charakter-Stats
  maxHp: 100,
  moveSpeed: 140,                       // px/s, bewusst langsam
  spreadMul: 1.0,                       // <1 = treffsicherer
  reloadMul: 1.0                        // <1 = schneller nachladen
};
const WEAPON = {                        // Waffen-Stats
  name: 'Karabiner',
  damage: 20,
  magSize: 12,
  interval: 0.20,                       // s zwischen Schüssen
  reloadTime: 1.5,                      // s
  spread: 1.5,                          // Grad Grundstreuung (stehend)
  bloomPerShot: 1.8,                    // Grad Zusatzstreuung je Schuss
  bloomMax: 9,
  bloomRecover: 9,                      // Grad/s
  moveSpread: 4,                        // Grad Zusatz bei voller Bewegung
  speed: 900,                           // px/s
  range: 760
};
const VISION = {
  fov: 100 * Math.PI / 180,             // Sichtkegel
  range: 640,
  near: 85                              // kleiner Rundumradius (Gehör/Umgebung)
};
const ENEMY_TYPES = {
  grunt:  { hp: 50, speed: 80,  chase: 95,  r: 14, color: '#c46a3a', shoots: true },
  rusher: { hp: 40, speed: 125, chase: 135, r: 13, color: '#b03a52', shoots: false }
};

// ---------- Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const fog = document.createElement('canvas');
const fctx = fog.getContext('2d');
let scale = 1;

function resize() {
  const w = Math.min(innerWidth, innerHeight * VIEW_W / VIEW_H);
  const h = w * VIEW_H / VIEW_W;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  fog.width = canvas.width;
  fog.height = canvas.height;
  scale = canvas.width / VIEW_W;
}
addEventListener('resize', resize);
resize();

// ---------- Hilfsfunktionen ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const normAngle = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const deg = Math.PI / 180;

function segRect(x1, y1, x2, y2, r) {
  let tmin = 0, tmax = 1;
  const dx = x2 - x1, dy = y2 - y1;
  if (Math.abs(dx) < 1e-9) { if (x1 < r.x || x1 > r.x + r.w) return Infinity; }
  else {
    let t1 = (r.x - x1) / dx, t2 = (r.x + r.w - x1) / dx;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return Infinity;
  }
  if (Math.abs(dy) < 1e-9) { if (y1 < r.y || y1 > r.y + r.h) return Infinity; }
  else {
    let t1 = (r.y - y1) / dy, t2 = (r.y + r.h - y1) / dy;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return Infinity;
  }
  return tmin;
}
function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1, fx = x1 - cx, fy = y1 - cy;
  const a = dx * dx + dy * dy;
  if (a < 1e-9) return Infinity;
  const b = 2 * (fx * dx + fy * dy), c = fx * fx + fy * fy - r * r;
  let disc = b * b - 4 * a * c;
  if (disc < 0) return Infinity;
  disc = Math.sqrt(disc);
  let t = (-b - disc) / (2 * a);
  if (t < 0) { t = (-b + disc) / (2 * a); if (t < 0) return Infinity; }
  return t <= 1 ? t : Infinity;
}
function rayDist(ox, oy, dx, dy, maxD, segs) {
  let best = maxD;
  for (const s of segs) {
    const sx = s[2] - s[0], sy = s[3] - s[1];
    const den = dx * sy - dy * sx;
    if (Math.abs(den) < 1e-9) continue;
    const t = ((s[0] - ox) * sy - (s[1] - oy) * sx) / den;
    if (t < 0 || t >= best) continue;
    const u = ((s[0] - ox) * dy - (s[1] - oy) * dx) / den;
    if (u >= 0 && u <= 1) best = t;
  }
  return best;
}

// ---------- Spielzustand ----------
let state = 'menu';                      // menu | play | pause | dead
let G;                                   // aktuelles Spiel
let best = Number(localStorage.getItem('jumpup-best') || 0);
const keys = {};
const mouse = { x: VIEW_W / 2, y: VIEW_H / 2, down: false };

function newGame() {
  G = {
    time: 0,
    camTop: 0,
    genTop: 0,
    obstacles: [], enemies: [], bullets: [], parts: [], pickups: [],
    kills: 0, dist: 0,
    nextWave: 25, nextSingle: 12, msg: '', msgT: 0, hurtT: 0,
    player: {
      x: WORLD_W / 2, y: -60, r: 14, hp: STATS.maxHp, angle: -Math.PI / 2,
      mag: WEAPON.magSize, cooldown: 0, reloadT: 0, bloom: 0, speed: 0
    }
  };
  G.camTop = G.player.y - VIEW_H * 0.78;
  generate();
}

// ---------- Level-Generierung ----------
function rectsGap(a, b, gap) {
  return a.x < b.x + b.w + gap && a.x + a.w + gap > b.x && a.y < b.y + b.h + gap && a.y + a.h + gap > b.y;
}
function freeSpot(r, tries = 40, y0, y1) {
  for (let i = 0; i < tries; i++) {
    const x = rand(60, WORLD_W - 60), y = rand(y0, y1);
    let ok = true;
    for (const o of G.obstacles) {
      const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
      if ((x - cx) ** 2 + (y - cy) ** 2 < (r + 24) ** 2) { ok = false; break; }
    }
    if (ok) return { x, y };
  }
  return null;
}
function makeEnemy(type, x, y, alert) {
  const t = ENEMY_TYPES[type];
  return {
    type, x, y, r: t.r, hp: t.hp, maxHp: t.hp,
    angle: rand(-Math.PI, Math.PI),
    state: alert ? 'alert' : 'idle',
    reaction: alert ? 0.4 : 0.7,
    cooldown: rand(0.5, 1.5), burst: 0, strafe: Math.random() < 0.5 ? 1 : -1, strafeT: rand(1, 2.5),
    lastX: G.player.x, lastY: G.player.y, lostT: 0, stuckT: 0, steerT: 0, steerDir: 1, hit: 0, melee: 0
  };
}
function generate() {
  while (G.genTop > G.camTop - CHUNK_H) {
    const y1 = G.genTop, y0 = G.genTop - CHUNK_H;
    const k = Math.round(-y1 / CHUNK_H);
    // Deckung
    const count = k === 0 ? 4 : Math.floor(rand(6, 10));
    for (let i = 0; i < count; i++) {
      for (let t = 0; t < 30; t++) {
        const w = rand(60, 170), h = rand(40, 120);
        const o = { x: rand(70, WORLD_W - 70 - w), y: rand(y0 + 30, y1 - h - 30), w, h };
        if (k === 0 && o.y + o.h > -230 && o.x < 700 && o.x + o.w > 260) continue;
        if (G.obstacles.some(p => rectsGap(o, p, 80))) continue;
        G.obstacles.push(o);
        break;
      }
    }
    // Gegner fest in der Welt
    if (k > 0) {
      const n = Math.min(2 + Math.floor(k * 0.6), 9);
      for (let i = 0; i < n; i++) {
        const spot = freeSpot(14, 40, y0 + 40, y1 - 40);
        if (!spot) continue;
        const rushP = Math.min(0.25 + k * 0.02, 0.45);
        const group = Math.random() < 0.35 ? 2 + Math.floor(Math.random() * 2) : 1;
        for (let g = 0; g < group; g++) {
          const type = Math.random() < rushP ? 'rusher' : 'grunt';
          const gx = clamp(spot.x + rand(-60, 60), 40, WORLD_W - 40), gy = spot.y + rand(-40, 40);
          if (G.obstacles.some(o => gx > o.x - 20 && gx < o.x + o.w + 20 && gy > o.y - 20 && gy < o.y + o.h + 20)) continue;
          G.enemies.push(makeEnemy(type, gx, gy, false));
        }
      }
    }
    // Medkit
    if (k > 0 && Math.random() < 0.5) {
      const s = freeSpot(14, 30, y0 + 40, y1 - 40);
      if (s) G.pickups.push({ x: s.x, y: s.y, heal: 30 });
    }
    G.genTop = y0;
  }
}

// ---------- Kollision ----------
function resolve(e) {
  for (const o of G.obstacles) {
    if (o.y > e.y + 80 || o.y + o.h < e.y - 80) continue;
    const cx = clamp(e.x, o.x, o.x + o.w), cy = clamp(e.y, o.y, o.y + o.h);
    const dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;
    if (d2 >= e.r * e.r) continue;
    if (d2 > 1e-6) {
      const d = Math.sqrt(d2);
      e.x += dx / d * (e.r - d); e.y += dy / d * (e.r - d);
    } else {
      const l = e.x - o.x, r = o.x + o.w - e.x, t = e.y - o.y, b = o.y + o.h - e.y, m = Math.min(l, r, t, b);
      if (m === l) e.x = o.x - e.r; else if (m === r) e.x = o.x + o.w + e.r;
      else if (m === t) e.y = o.y - e.r; else e.y = o.y + o.h + e.r;
    }
  }
  e.x = clamp(e.x, e.r, WORLD_W - e.r);
}
function moveCircle(e, dx, dy) {
  const ox = e.x, oy = e.y;
  e.x += dx; resolve(e);
  e.y += dy; resolve(e);
  return Math.hypot(e.x - ox, e.y - oy);
}
function hasLOS(x1, y1, x2, y2) {
  for (const o of G.obstacles) {
    if (Math.min(y1, y2) > o.y + o.h || Math.max(y1, y2) < o.y) continue;
    if (segRect(x1, y1, x2, y2, o) !== Infinity) return false;
  }
  return true;
}

// ---------- Schießen ----------
function currentSpread() {
  const p = G.player;
  const mv = Math.min(1, p.speed / STATS.moveSpeed);
  return (WEAPON.spread + p.bloom + WEAPON.moveSpread * mv) * STATS.spreadMul;   // Grad
}
function addBullet(x, y, angle, speed, dmg, from, range) {
  G.bullets.push({ x, y, px: x, py: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, dmg, from, life: range / speed });
}
function startReload() {
  const p = G.player;
  if (p.reloadT > 0 || p.mag >= WEAPON.magSize) return;
  p.reloadT = WEAPON.reloadTime * STATS.reloadMul;
}
function playerShoot() {
  const p = G.player;
  const a = p.angle + (Math.random() + Math.random() - 1) * currentSpread() * deg;
  addBullet(p.x, p.y, a, WEAPON.speed, WEAPON.damage, 'player', WEAPON.range);
  p.mag--;
  p.cooldown = WEAPON.interval;
  p.bloom = Math.min(WEAPON.bloomMax, p.bloom + WEAPON.bloomPerShot);
  // Mündungsfeuer
  for (let i = 0; i < 3; i++) G.parts.push({ x: p.x + Math.cos(p.angle) * 20, y: p.y + Math.sin(p.angle) * 20, vx: Math.cos(a) * rand(60, 200) + rand(-40, 40), vy: Math.sin(a) * rand(60, 200) + rand(-40, 40), life: 0.1, color: '#ffd37a' });
  // Lärm: Gegner in Hörweite werden aufmerksam
  for (const e of G.enemies) {
    if (e.state === 'idle' && Math.hypot(e.x - p.x, e.y - p.y) < 420) alertEnemy(e);
  }
  if (p.mag <= 0) startReload();
}
function alertEnemy(e) {
  e.state = 'alert'; e.reaction = 0.6; e.lastX = G.player.x; e.lastY = G.player.y; e.lostT = 0;
}

// ---------- Update ----------
function update(dt) {
  if (state !== 'play') return;
  const p = G.player;
  G.time += dt;

  // Bewegung (WASD)
  let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  let my = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  const len = Math.hypot(mx, my) || 1;
  const sp = STATS.moveSpeed * (p.reloadT > 0 ? 0.9 : 1);
  const moved = moveCircle(p, mx / len * sp * dt, my / len * sp * dt);
  p.speed = moved / dt;
  p.y = clamp(p.y, G.camTop + p.r, G.camTop + VIEW_H - p.r);   // nicht aus dem Bild zurück

  // Zielen
  p.angle = Math.atan2(mouse.y + G.camTop - p.y, mouse.x - p.x);

  // Waffe
  p.cooldown = Math.max(0, p.cooldown - dt);
  p.bloom = Math.max(0, p.bloom - WEAPON.bloomRecover * dt);
  if (p.reloadT > 0) {
    p.reloadT -= dt;
    if (p.reloadT <= 0) { p.reloadT = 0; p.mag = WEAPON.magSize; }
  } else if (mouse.down && p.cooldown <= 0 && p.mag > 0) {
    playerShoot();
  }

  // Kamera: nur nach oben, ab oberem Drittel
  if (p.y < G.camTop + VIEW_H / 3) G.camTop = p.y - VIEW_H / 3;
  G.dist = Math.max(G.dist, -p.y / PX_PER_M);
  generate();

  updateEnemies(dt);
  spawnReinforcements(dt);
  updateBullets(dt);

  // Pickups
  for (const k of G.pickups) {
    if (!k.taken && Math.hypot(k.x - p.x, k.y - p.y) < p.r + 12) {
      k.taken = true; p.hp = Math.min(STATS.maxHp, p.hp + k.heal);
      say('+' + k.heal + ' Leben');
    }
  }

  for (const q of G.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  G.hurtT = Math.max(0, G.hurtT - dt);
  G.msgT = Math.max(0, G.msgT - dt);

  // Aufräumen
  const bottom = G.camTop + VIEW_H + 250;
  G.obstacles = G.obstacles.filter(o => o.y < bottom);
  G.enemies = G.enemies.filter(e => e.hp > 0 && e.y < bottom);
  G.pickups = G.pickups.filter(k => !k.taken && k.y < bottom);
  G.parts = G.parts.filter(q => q.life > 0);

  if (p.hp <= 0) die();
}

function say(t) { G.msg = t; G.msgT = 2; }

function updateEnemies(dt) {
  const p = G.player;
  for (const e of G.enemies) {
    const T = ENEMY_TYPES[e.type];
    e.hit = Math.max(0, e.hit - dt);
    const dx = p.x - e.x, dy = p.y - e.y, dist = Math.hypot(dx, dy);
    const los = hasLOS(e.x, e.y, p.x, p.y);

    if (e.state === 'idle') {
      // bemerkt Spieler bei Sichtkontakt in Reichweite
      if (los && dist < 440) { e.reaction -= dt; if (e.reaction <= 0) alertEnemy(e); }
      else e.reaction = Math.min(0.7, e.reaction + dt);
      continue;
    }

    // alert
    if (los && dist < 640) { e.lastX = p.x; e.lastY = p.y; e.lostT = 0; }
    else { e.lostT += dt; }
    e.angle = Math.atan2(dy, dx);

    let dirx = 0, diry = 0, speed = T.speed;
    const tx = e.lastX - e.x, ty = e.lastY - e.y, td = Math.hypot(tx, ty) || 1;

    if (e.type === 'grunt') {
      if (los && dist < 640) {
        e.reaction -= dt;
        e.strafeT -= dt;
        if (e.strafeT <= 0) { e.strafe *= -1; e.strafeT = rand(1.2, 2.8); }
        if (dist > 380) { dirx = dx / dist; diry = dy / dist; speed = T.chase; }
        else if (dist < 230) { dirx = -dx / dist; diry = -dy / dist; }
        else { dirx = -dy / dist * e.strafe; diry = dx / dist * e.strafe; speed = T.speed * 0.8; }
        // Feuern in Salven
        e.cooldown -= dt;
        if (e.reaction <= 0 && e.cooldown <= 0) {
          const a = e.angle + (Math.random() + Math.random() - 1) * 6 * deg;
          addBullet(e.x, e.y, a, 430, 8, 'enemy', 760);
          e.burst++;
          if (e.burst >= 3) { e.burst = 0; e.cooldown = rand(1.3, 2.2); } else e.cooldown = 0.17;
        }
      } else if (td > 24) { dirx = tx / td; diry = ty / td; speed = T.chase; }
    } else { // rusher
      if (td > 6) { dirx = tx / td; diry = ty / td; speed = T.chase; }
      e.melee = Math.max(0, e.melee - dt);
      if (dist < e.r + p.r + 4 && e.melee <= 0) { hurtPlayer(12); e.melee = 0.7; }
    }

    // einfaches Ausweichen, falls festgesteckt
    if (e.steerT > 0) {
      e.steerT -= dt;
      const sx = dirx, sy = diry;
      dirx = -sy * e.steerDir; diry = sx * e.steerDir;
    }
    if (dirx || diry) {
      const moved = moveCircle(e, dirx * speed * dt, diry * speed * dt);
      if (moved < speed * dt * 0.3) {
        e.stuckT += dt;
        if (e.stuckT > 0.3) { e.steerT = 0.8; e.steerDir = Math.random() < 0.5 ? 1 : -1; e.stuckT = 0; }
      } else e.stuckT = 0;
    }
    // Abstand zu anderen Gegnern
    for (const o of G.enemies) {
      if (o === e) continue;
      const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy);
      if (od > 0 && od < e.r + o.r) moveCircle(e, ox / od * 40 * dt, oy / od * 40 * dt);
    }
    // Spieler verloren
    if (e.lostT > 6 && e.type === 'grunt') { e.state = 'idle'; e.reaction = 0.7; }
  }
}

// Unregelmäßig: Wellen und einzelne Nachzügler von oben
function spawnEnemy(type) {
  const y = G.camTop - rand(30, 120);
  for (let t = 0; t < 20; t++) {
    const x = rand(70, WORLD_W - 70);
    if (G.obstacles.some(o => x > o.x - 30 && x < o.x + o.w + 30 && y > o.y - 30 && y < o.y + o.h + 30)) continue;
    const e = makeEnemy(type, x, y, true);
    G.enemies.push(e);
    return true;
  }
  return false;
}
function spawnReinforcements(dt) {
  if (G.time >= G.nextWave) {
    const n = Math.min(2 + Math.floor(G.dist / 120), 5);
    for (let i = 0; i < n; i++) spawnEnemy(Math.random() < 0.35 ? 'rusher' : 'grunt');
    say('Verstärkung von oben!');
    G.nextWave = G.time + rand(22, 40);
  }
  if (G.time >= G.nextSingle) {
    if (Math.random() < 0.6) spawnEnemy(Math.random() < 0.4 ? 'rusher' : 'grunt');
    G.nextSingle = G.time + rand(9, 18);
  }
}

function hurtPlayer(d) {
  G.player.hp -= d;
  G.hurtT = 0.35;
}

function updateBullets(dt) {
  const p = G.player;
  for (const b of G.bullets) {
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    let tObs = Infinity;
    for (const o of G.obstacles) {
      if (Math.min(b.py, b.y) > o.y + o.h || Math.max(b.py, b.y) < o.y) continue;
      tObs = Math.min(tObs, segRect(b.px, b.py, b.x, b.y, o));
    }
    let tHit = Infinity, target = null;
    if (b.from === 'player') {
      for (const e of G.enemies) {
        if (e.hp <= 0) continue;
        const t = segCircle(b.px, b.py, b.x, b.y, e.x, e.y, e.r);
        if (t < tHit) { tHit = t; target = e; }
      }
    } else {
      const t = segCircle(b.px, b.py, b.x, b.y, p.x, p.y, p.r);
      if (t < tHit) { tHit = t; target = p; }
    }
    if (tObs === Infinity && tHit === Infinity) continue;
    if (tHit < tObs) {
      const hx = b.px + (b.x - b.px) * tHit, hy = b.py + (b.y - b.py) * tHit;
      if (target === p) hurtPlayer(b.dmg);
      else {
        target.hp -= b.dmg; target.hit = 0.12;
        if (target.state === 'idle') alertEnemy(target);
        if (target.hp <= 0) { G.kills++; }
      }
      spark(hx, hy, target === p ? '#d33' : '#e8e8e8');
    } else {
      const hx = b.px + (b.x - b.px) * tObs, hy = b.py + (b.y - b.py) * tObs;
      spark(hx, hy, '#bbb');
    }
    b.life = 0;
  }
  G.bullets = G.bullets.filter(b => b.life > 0);
}
function spark(x, y, color) {
  for (let i = 0; i < 4; i++) G.parts.push({ x, y, vx: rand(-90, 90), vy: rand(-90, 90), life: 0.25, color });
}

function die() {
  state = 'dead';
  if (G.dist > best) {
    best = G.dist;
    try { localStorage.setItem('jumpup-best', String(best)); } catch (e) {}
  }
}

// ---------- Sicht ----------
function obstacleSegments() {
  const segs = [], top = G.camTop - 800, bot = G.camTop + VIEW_H + 800;
  for (const o of G.obstacles) {
    if (o.y > bot || o.y + o.h < top) continue;
    segs.push([o.x, o.y, o.x + o.w, o.y], [o.x + o.w, o.y, o.x + o.w, o.y + o.h],
              [o.x + o.w, o.y + o.h, o.x, o.y + o.h], [o.x, o.y + o.h, o.x, o.y]);
  }
  segs.push([0, top - 2000, 0, bot + 2000], [WORLD_W, top - 2000, WORLD_W, bot + 2000]);
  return segs;
}
function visPoly(cx, cy, center, half, range, segs, step) {
  const full = half >= Math.PI - 1e-6;
  const rels = [];
  const n = Math.max(8, Math.ceil(2 * half / step));
  for (let i = 0; i <= n; i++) rels.push(-half + i * (2 * half / n));
  for (const o of G.obstacles) {
    if (o.x > cx + range || o.x + o.w < cx - range || o.y > cy + range || o.y + o.h < cy - range) continue;
    for (const [px, py] of [[o.x, o.y], [o.x + o.w, o.y], [o.x + o.w, o.y + o.h], [o.x, o.y + o.h]]) {
      const rel = normAngle(Math.atan2(py - cy, px - cx) - center);
      if (Math.abs(rel) <= half) rels.push(rel - 0.0003, rel, rel + 0.0003);
    }
  }
  rels.sort((a, b) => a - b);
  const pts = [];
  if (!full) pts.push([cx, cy]);
  for (const rel of rels) {
    if (rel < -half || rel > half) continue;
    const a = center + rel, dx = Math.cos(a), dy = Math.sin(a);
    const d = rayDist(cx, cy, dx, dy, range, segs);
    pts.push([cx + dx * d, cy + dy * d]);
  }
  return pts;
}
function visible(e) {
  const p = G.player;
  const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
  if (d > VISION.range + e.r) return false;
  const inNear = d < VISION.near + e.r;
  const rel = normAngle(Math.atan2(dy, dx) - p.angle);
  const inCone = Math.abs(rel) < VISION.fov / 2 + Math.atan2(e.r, Math.max(d, 1));
  if (!inNear && !inCone) return false;
  return hasLOS(p.x, p.y, e.x, e.y);
}

// ---------- Zeichnen ----------
function drawWorld() {
  const p = G.player, top = G.camTop;
  // Boden mit Raster
  ctx.fillStyle = '#23262b';
  ctx.fillRect(0, top, VIEW_W, VIEW_H);
  ctx.strokeStyle = '#2b2f35'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= VIEW_W; x += 80) { ctx.moveTo(x, top); ctx.lineTo(x, top + VIEW_H); }
  for (let y = Math.floor(top / 80) * 80; y <= top + VIEW_H; y += 80) { ctx.moveTo(0, y); ctx.lineTo(VIEW_W, y); }
  ctx.stroke();
  // Startzone
  ctx.fillStyle = 'rgba(80,120,90,.18)';
  ctx.fillRect(0, -120, VIEW_W, 120);
  // Randwände
  ctx.fillStyle = '#0e0f12';
  ctx.fillRect(0, top, 8, VIEW_H); ctx.fillRect(VIEW_W - 8, top, 8, VIEW_H);
  // Deckung
  for (const o of G.obstacles) {
    if (o.y > top + VIEW_H || o.y + o.h < top) continue;
    ctx.fillStyle = '#4b4338'; ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#6a5f4f'; ctx.fillRect(o.x + 3, o.y + 3, o.w - 6, o.h - 6);
    ctx.strokeStyle = '#3a342b'; ctx.lineWidth = 2; ctx.strokeRect(o.x, o.y, o.w, o.h);
  }
  // Medkits
  for (const k of G.pickups) {
    ctx.fillStyle = '#e8e8e8'; ctx.fillRect(k.x - 10, k.y - 10, 20, 20);
    ctx.fillStyle = '#d33'; ctx.fillRect(k.x - 7, k.y - 2, 14, 4); ctx.fillRect(k.x - 2, k.y - 7, 4, 14);
  }
}
function drawEntities() {
  const p = G.player;
  // Gegner nur im Sichtfeld
  for (const e of G.enemies) {
    if (e.hp <= 0 || !visible(e)) continue;
    const T = ENEMY_TYPES[e.type];
    ctx.fillStyle = e.hit > 0 ? '#fff' : T.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1a1010'; ctx.lineWidth = 2; ctx.stroke();
    if (e.type === 'grunt') {
      ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.angle) * 22, e.y + Math.sin(e.angle) * 22); ctx.stroke();
    }
    // Lebensbalken
    ctx.fillStyle = '#000'; ctx.fillRect(e.x - 14, e.y - e.r - 10, 28, 4);
    ctx.fillStyle = e.state === 'alert' ? '#e5483c' : '#d9b13a';
    ctx.fillRect(e.x - 14, e.y - e.r - 10, 28 * Math.max(0, e.hp / e.maxHp), 4);
  }
  // Geschosse
  for (const b of G.bullets) {
    if (b.from === 'enemy' && !pointVisible(b.x, b.y)) continue;
    ctx.strokeStyle = b.from === 'player' ? '#ffe08a' : '#ff6a5a';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.012, b.y - b.vy * 0.012); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const q of G.parts) { ctx.fillStyle = q.color; ctx.globalAlpha = Math.min(1, q.life * 5); ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1;
  // Spieler
  ctx.fillStyle = '#6fa8dc';
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#0d1a28'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(p.angle) * 26, p.y + Math.sin(p.angle) * 26); ctx.stroke();
}
function pointVisible(x, y) { return visible({ x, y, r: 0 }); }

function drawFog() {
  const p = G.player, segs = obstacleSegments();
  const cone = visPoly(p.x, p.y, p.angle, VISION.fov / 2, VISION.range, segs, 0.006);
  const ring = visPoly(p.x, p.y, 0, Math.PI, VISION.near, segs, 0.05);
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0, 0, fog.width, fog.height);
  fctx.fillStyle = 'rgba(4,5,8,0.74)';
  fctx.fillRect(0, 0, fog.width, fog.height);
  fctx.globalCompositeOperation = 'destination-out';
  fctx.setTransform(scale, 0, 0, scale, 0, -G.camTop * scale);
  fctx.fillStyle = '#000';
  for (const poly of [cone, ring]) {
    fctx.beginPath();
    poly.forEach((pt, i) => i ? fctx.lineTo(pt[0], pt[1]) : fctx.moveTo(pt[0], pt[1]));
    fctx.closePath(); fctx.fill();
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(fog, 0, 0);
  ctx.restore();
}

function drawCrosshair() {
  const p = G.player;
  const dist = Math.hypot(mouse.x - p.x, mouse.y + G.camTop - p.y);
  const gap = clamp(Math.tan(currentSpread() * deg) * dist, 5, 70);
  const x = mouse.x, y = mouse.y;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - gap - 8, y); ctx.lineTo(x - gap, y);
  ctx.moveTo(x + gap, y); ctx.lineTo(x + gap + 8, y);
  ctx.moveTo(x, y - gap - 8); ctx.lineTo(x, y - gap);
  ctx.moveTo(x, y + gap); ctx.lineTo(x, y + gap + 8);
  ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 1, 2, 2);
  if (p.reloadT > 0) {
    const f = 1 - p.reloadT / (WEAPON.reloadTime * STATS.reloadMul);
    ctx.strokeStyle = '#ffd37a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, gap + 16, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); ctx.stroke();
  }
}

function text(str, x, y, size, color = '#fff', align = 'left') {
  ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
  ctx.textAlign = align; ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function drawHUD() {
  const p = G.player;
  // Leben
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(16, VIEW_H - 34, 214, 22);
  ctx.fillStyle = '#d33'; ctx.fillRect(20, VIEW_H - 30, 206 * Math.max(0, p.hp / STATS.maxHp), 14);
  text(Math.ceil(Math.max(0, p.hp)) + ' HP', 24, VIEW_H - 18, 13, '#fff');
  // Munition
  text(p.reloadT > 0 ? 'Nachladen…' : p.mag + ' / ' + WEAPON.magSize, VIEW_W - 20, VIEW_H - 20, 26, p.mag === 0 ? '#ff6a5a' : '#fff', 'right');
  text(WEAPON.name, VIEW_W - 20, VIEW_H - 50, 13, '#aaa', 'right');
  // Distanz / Kills
  text(Math.floor(G.dist) + ' m', 20, 34, 28);
  text('Kills ' + G.kills + ' · Rekord ' + Math.floor(best) + ' m', 20, 56, 14, '#bbb');
  if (G.msgT > 0) text(G.msg, VIEW_W / 2, 60, 22, '#ffd37a', 'center');
  // Treffer-Vignette
  if (G.hurtT > 0) {
    const g = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.35, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.8);
    g.addColorStop(0, 'rgba(200,0,0,0)'); g.addColorStop(1, 'rgba(200,0,0,' + (G.hurtT * 1.6) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}
function overlay(lines) {
  ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  let y = VIEW_H / 2 - lines.length * 18;
  for (const [t, s, c] of lines) { text(t, VIEW_W / 2, y, s, c || '#fff', 'center'); y += s + 14; }
}

function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  if (!G) { overlay([['LEFT BEHIND', 56], ['Klicken zum Starten', 20, '#bbb']]); return; }
  ctx.save();
  ctx.translate(0, -G.camTop);
  drawWorld();
  drawEntities();
  ctx.restore();
  ctx.save();
  drawFog();
  ctx.restore();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHUD();
  if (state === 'play') drawCrosshair();
  if (state === 'pause') overlay([['Pause', 44], ['Esc / P zum Fortsetzen', 18, '#bbb']]);
  if (state === 'dead') overlay([
    ['Gefallen', 48, '#ff6a5a'],
    [Math.floor(G.dist) + ' m · ' + G.kills + ' Kills', 24],
    ['Rekord: ' + Math.floor(best) + ' m', 18, '#bbb'],
    ['Klick oder Enter für neuen Versuch', 18, '#ffd37a']
  ]);
  if (state === 'menu') overlay([
    ['LEFT BEHIND', 56],
    ['WASD bewegen · Maus zielen & schießen', 18, '#ddd'],
    ['R nachladen (dauert 1,5 s) · Esc/P Pause', 18, '#ddd'],
    ['Du kommst nur nach oben weiter, nie zurück.', 18, '#ddd'],
    ['Klick oder Enter zum Starten', 20, '#ffd37a']
  ]);
}

// ---------- Eingabe ----------
function begin() { newGame(); state = 'play'; }
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if ((state === 'menu' || state === 'dead') && (e.code === 'Enter' || e.code === 'Space')) { begin(); return; }
  if (state === 'play' && e.code === 'KeyR') startReload();
  if ((e.code === 'Escape' || e.code === 'KeyP') && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (state === 'play') state = 'pause'; });
function setMouse(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * VIEW_W;
  mouse.y = (e.clientY - r.top) / r.height * VIEW_H;
}
canvas.addEventListener('mousemove', setMouse);
canvas.addEventListener('mousedown', e => {
  setMouse(e);
  if (e.button !== 0) return;
  if (state === 'menu' || state === 'dead') { begin(); return; }
  if (state === 'pause') { state = 'play'; return; }
  mouse.down = true;
});
addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---------- Hauptschleife ----------
let last = 0;
function loop(t) {
  const dt = Math.min((t - (last || t)) / 1000, 0.05);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
